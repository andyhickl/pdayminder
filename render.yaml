services:
  - type: web
    name: pdayminder
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pday_db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: PDAYMINDER_USER
        sync: false        # set in dashboard: your email
      - key: PDAYMINDER_PASSWORD
        sync: false        # set in dashboard: a strong password (used once to create the account)

databases:
  - name: pday_db
    plan: basic-256mb
