<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDayMinder</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDayMinder">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- React + Babel from CDN -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0c1116;
      --card-bg: #111827;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e5e7eb;
      --muted: #6b7280;
      --border: #1f2933;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #root {
      width: 100%;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: 11px;
      color: var(--muted);
    }

    .icon-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(15, 23, 42, 0.95);
    }

    .icon-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .card {
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 55%),
                  var(--card-bg);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 10px 12px 12px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--muted);
    }

    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .day-nav-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      padding: 4px 8px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .day-nav-btn:hover {
      background: rgba(15, 23, 42, 1);
    }

    .day-nav-date {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
      text-decoration: underline dotted var(--muted);
      text-underline-offset: 3px;
    }
    .day-nav-date input[type="date"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 16px; /* keeps iOS from zooming */
    }
    .mini-cal-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mini-cal-nav button {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.4;
    }
    .mini-cal-nav button.today {
      font-size: 11px;
      color: var(--muted);
    }
    .mini-cal-month {
      min-width: 110px;
      text-align: center;
      font-weight: 600;
    }

    .mini-calendar {
      margin-top: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 6px;
      background: rgba(15, 23, 42, 0.8);
      font-size: 11px;
    }

    .mini-cal-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 4px;
    }
    .mini-cal-header .mini-cal-nav:last-child {
      justify-content: flex-end;
    }

    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .mini-cal-dayname {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      padding-bottom: 2px;
    }

    .mini-cal-cell {
      text-align: center;
      padding: 3px 0;
      border-radius: 999px;
      cursor: pointer;
      position: relative;
    }

    .mini-cal-cell.disabled {
      opacity: 0.25;
      cursor: default;
    }

    .mini-cal-cell.selected {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
    }

    .mini-cal-cell.today {
      border: 1px dashed var(--accent);
    }

    .mini-cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--accent);
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
    }

    .ring-container {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .ring-wrapper {
      width: 100%;
      max-width: 320px;
    }

    .ring-caption {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .pill-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .pill-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pill-btn:hover {
      background: rgba(15, 23, 42, 1);
    }

    .med-list {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .med-list span {
      color: var(--text);
    }

    .settings-card {
      margin-top: 4px;
      font-size: 12px;
    }

    .settings-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .settings-row label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .settings-input {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }

    .settings-help {
      font-size: 11px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 12px;
      width: min(420px, calc(100% - 24px));
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .modal-body {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
    }

    .face-display {
      font-size: 24px;
      width: 34px;
      text-align: center;
    }

    .checkbox-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-secondary, .btn-primary {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(15, 23, 42, 1);
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-primary:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    .quick-times {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .quick-time-pill {
      border-radius: 999px;
      border: 1px dashed var(--border);
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
      color: var(--muted);
    }

    .quick-time-pill:hover {
      border-style: solid;
      color: var(--text);
    }

    .footer-note {
      margin-top: 8px;
      font-size: 10px;
      text-align: center;
      color: var(--muted);
    }

    /* QoL summary card */
    .summary-card {
      margin-top: 4px;
    }

    .summary-chart {
      margin-top: 4px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2px;
      padding: 4px 2px;
    }

    .matrix-cell {
      width: 100%;
      padding-bottom: 60%;
      border-radius: 3px;
      background: #000000;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.7);
      cursor: pointer;
    }
    .matrix-cell:hover { box-shadow: 0 0 0 2px #38bdf8; }
    .matrix-cell.selected-day { box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.55); }
    .matrix-cell.future { cursor: default; opacity: 0.5; }
    .matrix-cell.future:hover { box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.7); }
    .qol-bars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      align-items: end;
      max-width: 220px;
    }
    .qol-bar-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .qol-bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
    .qol-bar-count { font-size: 10px; color: var(--muted); height: 12px; }
    .qol-bar-label { font-size: 10px; color: var(--muted); }
    .matrix-vnav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }
    .matrix-vnav button {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      min-height: 28px;
    }
    .matrix-vnav button.today { color: #38bdf8; font-size: 16px; }
    .matrix-vnav button:disabled { opacity: 0.3; cursor: default; }

    .summary-legend {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
    }

    .summary-legend strong {
      color: var(--text);
    }

    .data-card {
      margin-top: 4px;
      font-size: 12px;
    }

    .data-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .data-actions button {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      cursor: pointer;
    }

    .data-actions button:hover {
      background: rgba(15, 23, 42, 1);
    }

    .data-note {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 400px) {
      .app-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .settings-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ---------- API ----------
    // Auth is a session cookie set by /login. On 401 the session expired: go sign in.
    async function apiFetch(url, opts = {}) {
      const res = await fetch(url, { ...opts, credentials: "same-origin" });
      if (res.status === 401) window.location.href = "/login";
      return res;
    }

    // ---------- Utilities ----------
    function toDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatPrettyDate(date) {
      return date.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
      });
    }

    function parseTimeToMinutes(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      if (Number.isNaN(h) || Number.isNaN(m)) return 0;
      return h * 60 + m;
    }

    function minutesToTimeString(mins) {
      let m = mins % (24 * 60);
      if (m < 0) m += 24 * 60;
      const h = Math.floor(m / 60);
      const mm = m % 60;
      return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function isMinuteInSleep(minute, settings) {
      const start = parseTimeToMinutes(settings.sleepStart);
      const end = parseTimeToMinutes(settings.sleepEnd);
      if (start === end) return false;
      if (start < end) {
        return minute >= start && minute < end;
      } else {
        return minute >= start || minute < end;
      }
    }

    // ---------- Colors & faces ----------
    function ratingColor(rating) {
      switch (rating) {
        case 1: return "#ef4444";
        case 2: return "#f97316";
        case 3: return "#eab308";
        case 4: return "#22c55e";
        case 5: return "#0ea5e9"; // blue
        default: return "#374151";
      }
    }

    function faceForRating(r) {
      switch (r) {
        case 1: return "😫";
        case 2: return "😟";
        case 3: return "😐";
        case 4: return "🙂";
        case 5: return "😄";
        default: return "🙂";
      }
    }

    // ---------- Donut path ----------
    function describeDonutSegment(cx, cy, rInner, rOuter, startAngle, endAngle) {
      const x0 = cx + rOuter * Math.cos(startAngle);
      const y0 = cy + rOuter * Math.sin(startAngle);
      const x1 = cx + rOuter * Math.cos(endAngle);
      const y1 = cy + rOuter * Math.sin(endAngle);
      const x2 = cx + rInner * Math.cos(endAngle);
      const y2 = cy + rInner * Math.sin(endAngle);
      const x3 = cx + rInner * Math.cos(startAngle);
      const y3 = cy + rInner * Math.sin(startAngle);
      const largeArc = endAngle - startAngle <= Math.PI ? 0 : 1;

      return [
        "M", x0, y0,
        "A", rOuter, rOuter, 0, largeArc, 1, x1, y1,
        "L", x2, y2,
        "A", rInner, rInner, 0, largeArc, 0, x3, y3,
        "Z"
      ].join(" ");
    }

    // ---------- Defaults ----------
    const DEFAULT_SETTINGS = {
      sleepStart: "23:00",
      sleepEnd: "06:00",
      medTimes: ["08:00", "12:00", "16:00"],
    };

    // ---------- Local storage ----------
    function loadSettingsFromLocal() {
      try {
        const raw = localStorage.getItem("pdayminder-settings");
        if (!raw) return DEFAULT_SETTINGS;
        const parsed = JSON.parse(raw);
        return {
          sleepStart: parsed.sleepStart || DEFAULT_SETTINGS.sleepStart,
          sleepEnd: parsed.sleepEnd || DEFAULT_SETTINGS.sleepEnd,
          medTimes: Array.isArray(parsed.medTimes) && parsed.medTimes.length === 3
            ? parsed.medTimes
            : DEFAULT_SETTINGS.medTimes,
        };
      } catch {
        return DEFAULT_SETTINGS;
      }
    }

    function saveSettingsToLocal(settings) {
      localStorage.setItem("pdayminder-settings", JSON.stringify(settings));
    }

    function loadDaysFromLocal() {
      try {
        const raw = localStorage.getItem("pdayminder-days");
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed || {};
      } catch {
        return {};
      }
    }

    function saveDaysToLocal(days) {
      localStorage.setItem("pdayminder-days", JSON.stringify(days));
    }

    // ---------- CSV export/import ----------
    function exportDaysToCSV(days) {
      const header = "date,recordType,segmentIndex,segmentType,rating,medTime";
      const rows = [header];
      const keys = Object.keys(days).sort();

      for (const dateKey of keys) {
        const day = days[dateKey];
        if (!day) continue;
        day.segments.forEach((seg, idx) => {
          const segmentType = seg.type || "empty";
          const rating = seg.rating != null ? seg.rating : "";
          rows.push([
            dateKey,
            "segment",
            idx,
            segmentType,
            rating,
            ""
          ].join(","));
        });
        (day.meds || []).forEach((time) => {
          rows.push([
            dateKey,
            "med",
            "",
            "",
            "",
            time
          ].join(","));
        });
      }
      return rows.join("\n");
    }

    function importDaysFromCSV(text, settings) {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return {};
      const [, ...rows] = lines;
      const imported = {};

      for (const line of rows) {
        if (!line.trim()) continue;
        const cols = line.split(",").map(c => c.trim());
        const [dateKey, recordType, segmentIndexStr, segmentType, ratingStr, medTime] = cols;
        if (!dateKey || !recordType) continue;

        if (!imported[dateKey]) {
          imported[dateKey] = createEmptyDay(dateKey, settings);
        }
        const day = imported[dateKey];

        if (recordType === "segment") {
          const idx = parseInt(segmentIndexStr, 10);
          if (Number.isNaN(idx) || idx < 0 || idx >= day.segments.length) continue;
          const seg = { ...day.segments[idx] };
          seg.type = segmentType || "empty";
          seg.rating = ratingStr ? parseInt(ratingStr, 10) : 3;
          day.segments[idx] = seg;
        } else if (recordType === "med" && medTime) {
          day.meds.push(medTime);
        }
      }

      for (const key in imported) {
        imported[key].meds.sort();
      }
      return imported;
    }

    // ---------- Day model ----------
    function createEmptyDay(dateKey, settings) {
      const segments = Array.from({ length: 12 }, (_, idx) => ({
        type: "empty",
        rating: 3,
      }));
      segments.forEach((seg, idx) => {
        const midMinute = idx * 120 + 60;
        if (isMinuteInSleep(midMinute, settings)) {
          seg.type = "sleep";
        }
      });
      return { dateKey, segments, meds: [] };
    }

    // ---------- Components ----------
    function MiniCalendar({ selectedDate, daysWithData, onSelect }) {
      const todayKey = toDateKey(new Date());
      const selectedKey = toDateKey(selectedDate);
      // The month shown is independent of the selected day, so you can page around without losing your place.
      const [view, setView] = useState(() => new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1));
      useEffect(() => {
        setView(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1));
      }, [selectedKey]);
      const shiftMonth = (n) => setView((v) => new Date(v.getFullYear(), v.getMonth() + n, 1));

      const firstOfMonth = view;
      const firstDayIndex = firstOfMonth.getDay();
      const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();

      const weeks = [];
      let currentDay = 1;
      let started = false;

      for (let week = 0; week < 6; week++) {
        const row = [];
        for (let dow = 0; dow < 7; dow++) {
          if (!started && dow === firstDayIndex) {
            started = true;
          }
          if (!started || currentDay > daysInMonth) {
            row.push(null);
          } else {
            row.push(currentDay);
            currentDay++;
          }
        }
        weeks.push(row);
      }

      const dayNames = ["S", "M", "T", "W", "T", "F", "S"];

      return (
        <div className="mini-calendar">
          <div className="mini-cal-header">
            <div />
            <div className="mini-cal-nav">
              <button type="button" onClick={() => shiftMonth(-1)} aria-label="Previous month">‹</button>
              <span className="mini-cal-month">{view.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</span>
              <button type="button" onClick={() => shiftMonth(1)} aria-label="Next month">›</button>
            </div>
            <div className="mini-cal-nav">
              <button type="button" className="today" onClick={() => onSelect(new Date())}>Today</button>
            </div>
          </div>
          <div className="mini-cal-grid">
            {dayNames.map((d) => (
              <div key={d} className="mini-cal-dayname">{d}</div>
            ))}
            {weeks.map((row, ri) =>
              row.map((d, di) => {
                if (!d) {
                  return <div key={`${ri}-${di}`} className="mini-cal-cell disabled"></div>;
                }
                const dateObj = new Date(view.getFullYear(), view.getMonth(), d);
                const key = toDateKey(dateObj);
                const hasData = daysWithData.includes(key);
                const isSelected = key === selectedKey;
                const isToday = key === todayKey;
                const cls = [
                  "mini-cal-cell",
                  isSelected ? "selected" : "",
                  isToday ? "today" : "",
                ].join(" ");
                return (
                  <div
                    key={`${ri}-${di}`}
                    className={cls}
                    onClick={() => onSelect(dateObj)}
                  >
                    {d}
                    {hasData && <div className="mini-cal-dot"></div>}
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function DayRing({ day, onSegmentClick }) {
      const width = 260;
      const height = 260;
      const cx = width / 2;
      const cy = height / 2;
      const rOuter = 105;
      const rInner = 70;
      const segmentCount = 12;
      const segments = day.segments;

      function angleForTimeStr(timeStr) {
        const minutes = parseTimeToMinutes(timeStr);
        const fraction = minutes / (24 * 60);
        return fraction * Math.PI * 2 - Math.PI / 2;
      }

      return (
        <div className="ring-wrapper">
          <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", display: "block" }}>
            {segments.map((seg, idx) => {
              const startFrac = idx / segmentCount;
              const endFrac = (idx + 1) / segmentCount;
              const startAngle = startFrac * Math.PI * 2 - Math.PI / 2;
              const endAngle = endFrac * Math.PI * 2 - Math.PI / 2;

              let fill = "#1f2933";
              if (seg.type === "rating") fill = ratingColor(seg.rating);
              else if (seg.type === "sleep") fill = "#4b5563";
              else if (seg.type === "noData") fill = "#374151";
              else fill = "#111827";

              const path = describeDonutSegment(cx, cy, rInner, rOuter, startAngle, endAngle);
              const midAngle = (startAngle + endAngle) / 2;
              const iconRadius = (rInner + rOuter) / 2;
              const tx = cx + iconRadius * Math.cos(midAngle);
              const ty = cy + iconRadius * Math.sin(midAngle) + 4;

              let icon = "";
              if (seg.type === "sleep") icon = "😴";
              if (seg.type === "noData") icon = "?";

              const startHour = idx * 2;
              const endHour = startHour + 2;
              const label = `${String(startHour).padStart(2,"0")}:00–${String(endHour).padStart(2,"0")}:00`;

              return (
                <g key={idx} onClick={() => onSegmentClick(idx, label)}>
                  <path d={path} fill={fill} stroke="#020617" strokeWidth="1" />
                  {icon && (
                    <text
                      x={tx}
                      y={ty}
                      fontSize="12"
                      textAnchor="middle"
                      fill="#e5e7eb"
                    >
                      {icon}
                    </text>
                  )}
                </g>
              );
            })}

            {segments.map((_, idx) => {
              const startFrac = idx / segmentCount;
              const angle = startFrac * Math.PI * 2 - Math.PI / 2;
              const labelRadius = rOuter + 10;
              const x = cx + labelRadius * Math.cos(angle);
              const y = cy + labelRadius * Math.sin(angle) + 3;
              const startHour = idx * 2;
              const label = `${String(startHour).padStart(2, "0")}:00`;
              return (
                <text
                  key={`time-label-${idx}`}
                  x={x}
                  y={y}
                  fontSize="9"
                  textAnchor="middle"
                  fill="#9ca3af"
                >
                  {label}
                </text>
              );
            })}

            <circle cx={cx} cy={cy} r={rInner - 10} fill="#020617" />
            <text x={cx} y={cy - 4} textAnchor="middle" fontSize="11" fill="#9ca3af">
              QoL 1–5
            </text>
            <text x={cx} y={cy + 10} textAnchor="middle" fontSize="10" fill="#6b7280">
              tap a segment to rate QoL
            </text>

            {day.meds.map((t, i) => {
              const angle = angleForTimeStr(t);
              const innerR = rInner * 0.4;
              const outerR = rOuter * 1.05;
              const x1 = cx + innerR * Math.cos(angle);
              const y1 = cy + innerR * Math.sin(angle);
              const x2 = cx + outerR * Math.cos(angle);
              const y2 = cy + outerR * Math.sin(angle);

              const labelAngle = angle + (6 * Math.PI / 180);
              let labelRadius = rOuter + 22;
              const sinA = Math.sin(labelAngle);
              if (sinA > 0.75) labelRadius = rOuter + 14;

              const lx = cx + labelRadius * Math.cos(labelAngle);
              const ly = cy + labelRadius * Math.sin(labelAngle) + 3;

              return (
                <g key={`med-${i}-${t}`}>
                  <line
                    x1={x1}
                    y1={y1}
                    x2={x2}
                    y2={y2}
                    stroke="#38bdf8"
                    strokeWidth="2"
                    strokeLinecap="round"
                    opacity="0.9"
                  />
                  <text
                    x={lx}
                    y={ly}
                    fontSize="9"
                    textAnchor="middle"
                    fill="#38bdf8"
                  >
                    {t}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function SegmentModal({ open, segmentIndex, label, segment, onClose, onSave }) {
      const [rating, setRating] = useState(segment?.rating ?? 3);
      const [noData, setNoData] = useState(segment?.type === "noData");
      const [sleep, setSleep] = useState(segment?.type === "sleep");

      useEffect(() => {
        if (segment) {
          setRating(segment.rating ?? 3);
          setNoData(segment.type === "noData");
          setSleep(segment.type === "sleep");
        }
      }, [segmentIndex, segment]);

      if (!open || !segment) return null;

      const handleSave = () => {
        let newSeg;
        if (sleep) newSeg = { type: "sleep", rating };
        else if (noData) newSeg = { type: "noData", rating };
        else newSeg = { type: "rating", rating };
        onSave(segmentIndex, newSeg);
      };

      const disableSlider = noData || sleep;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">Rate QoL for this 2-hour block</div>
                <div style={{ fontSize: "11px", color: "var(--muted)" }}>{label}</div>
              </div>
            </div>
            <div className="modal-body">
              <div style={{ fontSize: "11px", color: "var(--muted)" }}>
                Use the slider for your overall Quality of Life in this window, or mark it as sleep / no data.
              </div>
              <div className="slider-row">
                <span style={{ fontSize: "16px" }}>☹️</span>
                <input
                  type="range"
                  min="1"
                  max="5"
                  step="1"
                  value={rating}
                  disabled={disableSlider}
                  onChange={(e) => setRating(parseInt(e.target.value, 10))}
                />
                <span style={{ fontSize: "16px" }}>😊</span>
                <div className="face-display">
                  {sleep ? "😴" : noData ? "?" : faceForRating(rating)}
                </div>
              </div>
              <div className="checkbox-row">
                <label className="checkbox-inline">
                  <input
                    type="checkbox"
                    checked={noData}
                    onChange={(e) => {
                      const checked = e.target.checked;
                      setNoData(checked);

                  />
                  <span>No data for this block (show “?”)</span>
                </label>
                <label className="checkbox-inline">
                  <input
                    type="checkbox"
                    checked={sleep}
                    onChange={(e) => {
                      const checked = e.target.checked;
                      setSleep(checked);
                      if (checked) setNoData(false);
                    }}
                  />
                  <span>Sleeping during this block (show 😴)</span>
                </label>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn-secondary" onClick={onClose}>Cancel</button>
              <button className="btn-primary" onClick={handleSave}>Save</button>
            </div>
          </div>
        </div>
      );
    }

            </div>
            <div className="modal-body">
              <div style={{ fontSize: "11px", color: "var(--muted)" }}>

              <label style={{ display: "flex", flexDirection: "column", gap: "4px" }}>

    // ---------- Trends (server rollups + inline SVG) ----------
    function useJson(url, deps) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let alive = true;
        apiFetch(url).then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
          .then((d) => alive && setData(d)).catch((e) => alive && setErr(String(e)));
        return () => { alive = false; };
      }, deps);
      return [data, err];
    }

    // Two series, shared x (days), independent y axes. Left = primary, right = overlay. Bars = optional counts.
    function DualAxisChart({ rows, left, right, bars, height = 150 }) {
      const W = 600, H = height, padL = 32, padR = right ? 36 : 10, padT = 8, padB = 20;
      const n = rows.length;
      const x = (i) => padL + (n <= 1 ? 0 : (i * (W - padL - padR)) / (n - 1));
      const series = (cfg) => {
        if (!cfg) return null;
        const vals = rows.map((r) => (r[cfg.key] == null ? null : Number(r[cfg.key])));
        const present = vals.filter((v) => v != null);
        if (!present.length) return { vals, lo: 0, hi: 1, empty: true };
        let lo = cfg.min != null ? cfg.min : Math.min(...present);
        let hi = cfg.max != null ? cfg.max : Math.max(...present);
        if (cfg.min == null && cfg.max == null) { const pad = (hi - lo || Math.abs(hi) || 1) * 0.08; lo -= pad; hi += pad; }
        const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
        let d = "", pen = false;
        vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? " L" : " M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
        return { vals, lo, hi, y, d };
      };
      const L = series(left), R = series(right);
      const fmt = (v) => (Math.abs(v) >= 100 ? Math.round(v) : Number.isInteger(v) ? v : v.toFixed(1));
      const barMax = bars ? Math.max(1, ...rows.map((r) => Number(r[bars.key]) || 0)) : 1;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: H, display: "block" }}>
          {L && [L.lo, (L.lo + L.hi) / 2, L.hi].map((t, i) => (
            <g key={i}>
              <line x1={padL} x2={W - padR} y1={L.y(t)} y2={L.y(t)} stroke="#1f2937" />
              <text x={padL - 4} y={L.y(t) + 4} fontSize="10" fill={left.color} textAnchor="end">{fmt(t)}</text>
            </g>
          ))}
          {R && !R.empty && [R.lo, (R.lo + R.hi) / 2, R.hi].map((t, i) => (
            <text key={i} x={W - padR + 4} y={R.y(t) + 4} fontSize="10" fill={right.color}>{fmt(t)}</text>
          ))}
          {bars && rows.map((r, i) => {
            const v = Number(r[bars.key]) || 0; if (!v) return null;
            const h = ((H - padT - padB) * v) / barMax;
            return <rect key={i} x={x(i) - 3} y={H - padB - h} width="6" height={h} fill="#334155" rx="1" />;
          })}
          {R && !R.empty && <path d={R.d} fill="none" stroke={right.color} strokeWidth="1.5" strokeDasharray="4 3" />}
          {R && !R.empty && R.vals.map((v, i) => v == null ? null : <circle key={i} cx={x(i)} cy={R.y(v)} r="2" fill={right.color} />)}
          {L && <path d={L.d} fill="none" stroke={left.color} strokeWidth="2" strokeLinejoin="round" />}
          {L && L.vals.map((v, i) => v == null ? null : <circle key={i} cx={x(i)} cy={L.y(v)} r="2.5" fill={left.color} />)}
          {rows.map((r, i) => (i % Math.ceil(n / 6) === 0 || i === n - 1) ? (
            <text key={i} x={x(i)} y={H - 5} fontSize="10" fill="#64748b" textAnchor="middle">{r.day.slice(5)}</text>
          ) : null)}
        </svg>
      );
    }
    function ChartLegend({ items }) {
      return (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 14, fontSize: 11, color: "#94a3b8", margin: "6px 0 2px" }}>
          {items.filter(Boolean).map((it) => (
            <span key={it.label} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
              <span style={{ width: 14, height: it.bar ? 8 : 0, borderTop: it.bar ? 0 : `2px ${it.dashed ? "dashed" : "solid"} ${it.color}`, background: it.bar ? it.color : "none", display: "inline-block" }} />
              {it.label}
            </span>
          ))}
        </div>
      );
    }

    // ---------- Day vitals: hourly HR/HRV over QoL bands with dose markers ----------
    const QOL_COLORS = { 1: "#ef4444", 2: "#f97316", 3: "#eab308", 4: "#22c55e", 5: "#38bdf8" };
    function hourOf(ts) {
      const d = new Date(ts);
      const parts = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "numeric", hour12: false, timeZone: "America/Los_Angeles" }).formatToParts(d);
      const h = Number(parts.find((p) => p.type === "hour").value) % 24;
      const m = Number(parts.find((p) => p.type === "minute").value);
      return h + m / 60;
    }

    function DayVitalsChart({ data }) {
      const W = 600, H = 220, padL = 34, padR = 34, padT = 14, padB = 20;
      const x = (h) => padL + ((W - padL - padR) * h) / 24;
      const avg = data.hourly.heart_rate_avg || [];
      const mn = data.hourly.heart_rate_min || [];
      const mx = data.hourly.heart_rate_max || [];
      const hrv = data.hourly.heart_rate_variability || [];
      const hrVals = [...avg, ...mn, ...mx].map((p) => p.value);
      const lo = hrVals.length ? Math.min(...hrVals) - 5 : 40, hi = hrVals.length ? Math.max(...hrVals) + 5 : 120;
      const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
      const hrvVals = hrv.map((p) => p.value);
      const hlo = hrvVals.length ? Math.min(...hrvVals) * 0.8 : 0, hhi = hrvVals.length ? Math.max(...hrvVals) * 1.1 : 100;
      const yh = (v) => padT + (H - padT - padB) * (1 - (v - hlo) / (hhi - hlo || 1));
      const line = (pts, yf) => pts.map((p, i) => (i ? "L" : "M") + x(hourOf(p.ts) + 0.5).toFixed(1) + " " + yf(p.value).toFixed(1)).join(" ");
      const byHour = (arr) => Object.fromEntries(arr.map((p) => [Math.floor(hourOf(p.ts)), p.value]));
      const mnH = byHour(mn), mxH = byHour(mx);
      const bandHours = Object.keys(mnH).filter((h) => mxH[h] != null).map(Number).sort((a, b) => a - b);
      const band = bandHours.length
        ? "M" + bandHours.map((h) => x(h + 0.5).toFixed(1) + " " + y(mxH[h]).toFixed(1)).join(" L") +
          " L" + bandHours.slice().reverse().map((h) => x(h + 0.5).toFixed(1) + " " + y(mnH[h]).toFixed(1)).join(" L") + " Z"
        : "";
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: H, display: "block" }}>
          {data.qol.map((q) => (
            <rect key={q.seg} x={x(q.seg * 2)} y={padT} width={x(2) - x(0)} height={H - padT - padB}
              fill={q.type === "rating" ? QOL_COLORS[q.rating] : q.type === "sleep" ? "#475569" : "#0f172a"} opacity={q.type === "rating" ? 0.22 : 0.25} />
          ))}
          {[0, 6, 12, 18, 24].map((h) => (
            <g key={h}>
              <line x1={x(h)} x2={x(h)} y1={padT} y2={H - padB} stroke="#1f2937" />
              <text x={x(h)} y={H - 5} fontSize="10" fill="#64748b" textAnchor="middle">{String(h).padStart(2, "0")}:00</text>
            </g>
          ))}
          {band && <path d={band} fill="#38bdf8" opacity="0.18" />}
          {avg.length > 0 && <path d={line(avg, y)} fill="none" stroke="#38bdf8" strokeWidth="2" />}
          {hrv.length > 0 && <path d={line(hrv, yh)} fill="none" stroke="#a3e635" strokeWidth="1.5" strokeDasharray="4 3" />}
          {hrv.map((p, i) => <circle key={i} cx={x(hourOf(p.ts) + 0.5)} cy={yh(p.value)} r="3" fill="#a3e635" />)}
          {(data.motor || []).map((m, i) => {
            const isTap = m.tap_updrs != null; const score = isTap ? m.tap_updrs : m.updrs;
            return (
              <g key={"m" + i}>
                <circle cx={x(hourOf(m.ts))} cy={H - padB - (isTap ? 20 : 8)} r="5" fill={isTap ? "#38bdf8" : "#f472b6"} stroke="#0f172a" strokeWidth="1" />
                <text x={x(hourOf(m.ts))} y={H - padB - (isTap ? 17 : 5)} fontSize="8" fill="#0f172a" textAnchor="middle" fontWeight="700">{score == null ? "·" : score}</text>
              </g>
            );
          })}
          {data.doses.map((d, i) => {
            const [hh, mm] = d.t.split(":").map(Number);
            return (
              <g key={i}>
                <line x1={x(hh + mm / 60)} x2={x(hh + mm / 60)} y1={padT} y2={H - padB} stroke="#f8fafc" strokeWidth="1.5" strokeDasharray="2 2" />
                <text x={x(hh + mm / 60)} y={padT + 9} fontSize="9" fill="#f8fafc" textAnchor="middle">💊</text>
              </g>
            );
          })}
          <text x={padL - 4} y={y(hi) + 10} fontSize="10" fill="#38bdf8" textAnchor="end">{Math.round(hi)}</text>
          <text x={padL - 4} y={y(lo)} fontSize="10" fill="#38bdf8" textAnchor="end">{Math.round(lo)}</text>
          <text x={padL - 4} y={padT - 4} fontSize="9" fill="#38bdf8" textAnchor="end">bpm</text>
          {hrv.length > 0 && <>
            <text x={W - padR + 4} y={yh(hhi) + 10} fontSize="10" fill="#a3e635">{Math.round(hhi)}</text>
            <text x={W - padR + 4} y={yh(hlo)} fontSize="10" fill="#a3e635">{Math.round(hlo)}</text>
            <text x={W - padR + 4} y={padT - 4} fontSize="9" fill="#a3e635">HRV</text>
          </>}
        </svg>
      );
    }

    function DayVitalsCard({ dateKey, days }) {
      // re-fetch when the day's local QoL/meds change too, so bands and dose lines stay in sync
      const localDay = days[dateKey];
      const sig = localDay ? JSON.stringify([localDay.segments, localDay.meds]) : "";
      const [data, err] = useJson(`/api/day?day=${dateKey}`, [dateKey, sig]);
      const fmt = (v, d = 0) => (v == null ? "–" : Number(v).toFixed(d));
      const d = data ? data.daily : {};

    // Spearman rank correlation on paired, non-null values. Returns {r, n} or null when too few pairs.
    function spearman(pairs) {
      const n = pairs.length;
      if (n < 7) return null;
      const rank = (arr) => {
        const idx = arr.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
        const ranks = new Array(n);
        for (let i = 0; i < n;) {
          let j = i; while (j + 1 < n && idx[j + 1][0] === idx[i][0]) j++;
          const avg = (i + j) / 2 + 1;
          for (let k = i; k <= j; k++) ranks[idx[k][1]] = avg;
          i = j + 1;
        }
        return ranks;
      };
      const rx = rank(pairs.map((p) => p[0])), ry = rank(pairs.map((p) => p[1]));
      const mx = rx.reduce((a, b) => a + b, 0) / n, my = ry.reduce((a, b) => a + b, 0) / n;
      let num = 0, dx = 0, dy = 0;
      for (let i = 0; i < n; i++) { num += (rx[i] - mx) * (ry[i] - my); dx += (rx[i] - mx) ** 2; dy += (ry[i] - my) ** 2; }
      if (!dx || !dy) return { r: 0, n };
      return { r: num / Math.sqrt(dx * dy), n };
    }
    function describeCorrelation(c) {
      if (!c) return "Need at least 7 days with both values to estimate a correlation.";
      const a = Math.abs(c.r);
      const strength = a < 0.2 ? "no real" : a < 0.4 ? "a weak" : a < 0.6 ? "a moderate" : "a strong";
      const dir = c.r > 0 ? "positive" : "negative";
      const t = a * Math.sqrt((c.n - 2) / (1 - a * a || 1e-9));
      const conf = c.n < 14 ? "very few days, treat as a hint" : t < 2 ? "could easily be chance" : "unlikely to be chance";
      return `${strength}${a < 0.2 ? "" : " " + dir} relationship (r = ${c.r.toFixed(2)}, ${c.n} days; ${conf}).`;
    }

    // ---------- Tremor test: 20 s of phone accelerometer, scored on 3.5–7.5 Hz band power ----------
    const TREMOR_SECONDS = 20;
    function analyzeTremor(samples) {
      // samples: [{t (ms), x, y, z}], gravity removed when the browser provides it.
      // Each axis is resampled to 50 Hz, detrended, Hann-windowed and transformed; power spectra are summed
      // across axes (summing powers keeps frequencies intact, unlike taking the vector magnitude first).
      if (samples.length < 100) return null;
      const t0 = samples[0].t, dur = (samples[samples.length - 1].t - t0) / 1000;
      const fs = 50, n = Math.floor(dur * fs);
      const freqs = []; for (let f = 1; f <= 15.0001; f += 0.1) freqs.push(Number(f.toFixed(1)));
      const power = new Float64Array(freqs.length);
      let sumSq = 0;
      for (const axis of ["x", "y", "z"]) {
        const u = new Float64Array(n);
        let j = 0;
        for (let i = 0; i < n; i++) {
          const tt = t0 + (i / fs) * 1000;
          while (j < samples.length - 2 && samples[j + 1].t < tt) j++;
          const a = samples[j], b = samples[j + 1];
          const w = b.t === a.t ? 0 : (tt - a.t) / (b.t - a.t);
          u[i] = a[axis] + (b[axis] - a[axis]) * w;
        }
        const mean = u.reduce((a, b) => a + b, 0) / n;
        for (let i = 0; i < n; i++) { u[i] = (u[i] - mean) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1))); sumSq += u[i] * u[i]; }
        freqs.forEach((f, fi) => {
          let re = 0, im = 0; const k = (2 * Math.PI * f) / fs;
          for (let i = 0; i < n; i++) { re += u[i] * Math.cos(k * i); im -= u[i] * Math.sin(k * i); }
          power[fi] += (re * re + im * im) / n;
        });
      }
      const total = power.reduce((a, b) => a + b, 0) || 1e-12;
      let band = 0, peakI = 0;
      freqs.forEach((f, i) => { if (f >= 3.5 && f <= 7.5) band += power[i]; if (power[i] > power[peakI]) peakI = i; });
      const hannGain = 2.67; // 1 / mean(hann^2)
      // 1.25: empirical calibration of the 0.1 Hz-spaced DFT band sum against known sinusoids (recovers amplitude within ~2%)
      const rmsBand = Math.sqrt((band / n) * 2 * hannGain) * 1.25;
      const rmsAll = Math.sqrt((sumSq / n) * hannGain);
      const pmax = Math.max(...power) || 1;
      // Peak frequency inside the tremor band (falls back to 5 Hz when the band is empty)
      let bandPeakI = -1;
      freqs.forEach((f, i) => { if (f >= 3.5 && f <= 7.5 && (bandPeakI < 0 || power[i] > power[bandPeakI])) bandPeakI = i; });
      const bandHz = bandPeakI >= 0 ? freqs[bandPeakI] : 5;
      // Displacement from acceleration for a sinusoid: x = a / (2*pi*f)^2. Peak-to-peak, in cm.
      const aPeak = rmsBand * Math.SQRT2;
      const ampCm = (2 * aPeak) / Math.pow(2 * Math.PI * bandHz, 2) * 100;
      // MDS-UPDRS 3.17 amplitude bins: 0 none, 1 <1 cm, 2 1–3 cm, 3 3–10 cm, 4 >10 cm. Floor at 0.1 cm for "none".
      const updrs = ampCm < 0.1 ? 0 : ampCm < 1 ? 1 : ampCm < 3 ? 2 : ampCm < 10 ? 3 : 4;
      return {
        seconds: Number(dur.toFixed(1)), samples: samples.length, sampleRate: Number((samples.length / dur).toFixed(1)),
        bandRatio: band / total, peakHz: freqs[peakI], bandHz, rmsBand, rmsAll, ampCm, updrs,
        spectrum: freqs.map((f, i) => [f, power[i] / pmax]),
      };
    }

                {(() => { const vals = hist.map((h) => h.value); const hi = Math.max(1.2, ...vals); const x = (i) => 10 + (580 * i) / Math.max(1, hist.length - 1); const y = (v) => 52 - (46 * v) / hi;
                  return <>
                    {[1, 3].filter((v) => v < hi).map((v) => <line key={v} x1="10" x2="590" y1={y(v)} y2={y(v)} stroke="#334155" strokeDasharray="3 3" />)}
                    <path d={"M" + hist.map((h, i) => `${x(i).toFixed(1)} ${y(h.value).toFixed(1)}`).join(" L")} fill="none" stroke="#f472b6" strokeWidth="1.5" />
                    {hist.map((h, i) => <circle key={i} cx={x(i)} cy={y(h.value)} r="2.5" fill={h.raw && h.raw.hand === "left" ? "#60a5fa" : "#f472b6"}><title>{new Date(h.ts).toLocaleString()} · {h.raw && h.raw.hand} {h.raw && h.raw.posture} · {h.value.toFixed(2)} cm{h.raw && h.raw.note ? " · " + h.raw.note : ""}</title></circle>)}
                  </>; })()}
              </svg>
              <div style={{ fontSize: 10, color: "#64748b" }}>pink = right hand, blue = left. Compare like with like (same hand and posture).</div>
            </div>
          )}
        </div>
      );
    }

    // ---------- Finger tapping test: alternate taps between two targets for 20 s ----------
    const TAP_SECONDS = 20;
    function analyzeTaps(taps) {
      // taps: [{t (ms), target: 0|1, x, y}] in order
      if (taps.length < 5) return null;
      const dur = (taps[taps.length - 1].t - taps[0].t) / 1000;
      const iti = []; let correct = 0;
      for (let i = 1; i < taps.length; i++) { iti.push(taps[i].t - taps[i - 1].t); if (taps[i].target !== taps[i - 1].target) correct++; }
      const mean = iti.reduce((a, b) => a + b, 0) / iti.length;
      const sd = Math.sqrt(iti.reduce((a, b) => a + (b - mean) ** 2, 0) / iti.length);
      const cv = sd / mean;
      const half = Math.floor(iti.length / 2);
      const rate1 = 1000 / (iti.slice(0, half).reduce((a, b) => a + b, 0) / half);
      const rate2 = 1000 / (iti.slice(half).reduce((a, b) => a + b, 0) / (iti.length - half));
      const decrement = (rate1 - rate2) / rate1; // + = slowed down over the test
      const hesitations = iti.filter((v) => v > 2 * mean).length;
      const rate = taps.length / dur;
      // Heuristic score in the spirit of MDS-UPDRS 3.4 (rate, rhythm, decrement, hesitations). Not calibrated to clinic ratings.
      let score = rate >= 4 ? 0 : rate >= 3 ? 1 : rate >= 2 ? 2 : rate >= 1 ? 3 : 4;
      if (cv > 0.25 || decrement > 0.25 || hesitations >= 3) score = Math.min(4, score + 1);
      return { taps: taps.length, seconds: Number(dur.toFixed(1)), rate, itiMs: mean, cv, decrement, hesitations, accuracy: correct / (taps.length - 1), score, iti };
    }

    function TapTestCard() {

                {(() => { const vals = hist.map((h) => h.value); const hi = Math.max(5, ...vals); const x = (i) => 10 + (580 * i) / Math.max(1, hist.length - 1); const y = (v) => 52 - (46 * v) / hi;
                  return <>
                    <path d={"M" + hist.map((h, i) => `${x(i).toFixed(1)} ${y(h.value).toFixed(1)}`).join(" L")} fill="none" stroke="#38bdf8" strokeWidth="1.5" />
                    {hist.map((h, i) => <circle key={i} cx={x(i)} cy={y(h.value)} r="2.5" fill={h.raw && h.raw.hand === "left" ? "#60a5fa" : "#38bdf8"}><title>{new Date(h.ts).toLocaleString()} · {h.raw && h.raw.hand} · {h.value.toFixed(2)} taps/s{h.raw && h.raw.note ? " · " + h.raw.note : ""}</title></circle>)}
                  </>; })()}
              </svg>
            </div>

      );
    }

    // ---------- Voice test: 5 s sustained "ahh", frame-based jitter / shimmer / HNR ----------
    const VOICE_SECONDS = 5;
    function analyzeVoice(pcm, sampleRate) {
      // 1) Frame pass (40 ms / 20 ms hop): energy, voicing, coarse F0 by normalized autocorrelation (70–400 Hz).
      // 2) Period pass over the longest voiced run: peak-to-peak periods and peak amplitudes -> local jitter, shimmer
      //    (Praat-style definitions), and HNR from a period-averaged harmonic template vs residual.
      const frame = Math.round(sampleRate * 0.04), hop = Math.round(sampleRate * 0.02);
      const minLag = Math.round(sampleRate / 400), maxLag = Math.round(sampleRate / 70);
      const frames = [];
      for (let start = 0; start + frame <= pcm.length; start += hop) {
        let e = 0; for (let i = 0; i < frame; i++) e += pcm[start + i] * pcm[start + i];
        frames.push({ start, rms: Math.sqrt(e / frame) });
      }
      if (!frames.length) return null;
      const maxRms = Math.max(...frames.map((f) => f.rms));
      const voicedThresh = Math.max(0.01, maxRms * 0.2);
      for (const f of frames) {
        if (f.rms < voicedThresh) { f.voiced = false; continue; }
        let mean = 0; for (let i = 0; i < frame; i++) mean += pcm[f.start + i]; mean /= frame;
        let best = 0, bestLag = 0, e0 = 0;
        for (let i = 0; i < frame; i++) { const v = pcm[f.start + i] - mean; e0 += v * v; }
        for (let lag = minLag; lag <= maxLag; lag++) {
          let num = 0, e1 = 0;
          for (let i = 0; i + lag < frame; i++) { const a = pcm[f.start + i] - mean, b = pcm[f.start + i + lag] - mean; num += a * b; e1 += b * b; }
          const r = num / Math.sqrt((e0 || 1e-12) * (e1 || 1e-12));
          if (r > best) { best = r; bestLag = lag; }
        }
        f.voiced = best > 0.5; if (f.voiced) f.f0 = sampleRate / bestLag;
      }
      // longest voiced run
      let run = [], longest = [];
      frames.forEach((f) => { if (f.voiced) { run.push(f); if (run.length > longest.length) longest = run; } else run = []; });
      const voicedSeconds = frames.filter((f) => f.voiced).length * 0.02;
      if (longest.length < 10) return { voicedSeconds, tooShort: true };
      const f0s = longest.map((f) => f.f0);
      const medF0 = [...f0s].sort((a, b) => a - b)[Math.floor(f0s.length / 2)];
      const T = sampleRate / medF0;
      const from = longest[0].start, to = longest[longest.length - 1].start + frame;
      // period pass: successive positive peaks about one period apart (search window ±35%)
      const peaks = [];
      let i = from;
      // first peak: max in first 1.5 periods
      { let m = -Infinity, mi = i; for (let j = i; j < Math.min(to, i + Math.round(1.5 * T)); j++) if (pcm[j] > m) { m = pcm[j]; mi = j; } peaks.push(mi); i = mi; }
      while (i + Math.round(1.35 * T) < to) {
        const lo = i + Math.round(0.65 * T), hi = i + Math.round(1.35 * T);
        let m = -Infinity, mi = lo; for (let j = lo; j <= hi; j++) if (pcm[j] > m) { m = pcm[j]; mi = j; }
        peaks.push(mi); i = mi;
      }
      if (peaks.length < 10) return { voicedSeconds, tooShort: true };
      const periods = [], amps = [];
      for (let k = 1; k < peaks.length; k++) {
        periods.push(peaks[k] - peaks[k - 1]);
        let mn = Infinity, mx = -Infinity; for (let j = peaks[k - 1]; j < peaks[k]; j++) { if (pcm[j] < mn) mn = pcm[j]; if (pcm[j] > mx) mx = pcm[j]; }
        amps.push(mx - mn);
      }
      const meanT = periods.reduce((a, b) => a + b, 0) / periods.length, meanA = amps.reduce((a, b) => a + b, 0) / amps.length;
      let dj = 0, ds = 0; for (let k = 1; k < periods.length; k++) { dj += Math.abs(periods[k] - periods[k - 1]); ds += Math.abs(amps[k] - amps[k - 1]); }
      const jitter = dj / (periods.length - 1) / meanT, shimmer = ds / (amps.length - 1) / meanA;
      // HNR: average all periods (resampled to meanT samples) -> harmonic template; residual = noise
      const L = Math.round(meanT); const tmpl = new Float64Array(L); let cnt = 0;
      const resample = (a, b) => { const out = new Float64Array(L); const n = b - a; for (let q = 0; q < L; q++) { const pos = a + (q / L) * n; const i0 = Math.floor(pos), w = pos - i0; out[q] = pcm[i0] * (1 - w) + (pcm[Math.min(i0 + 1, pcm.length - 1)] || 0) * w; } return out; };
      const segs = [];
      for (let k = 1; k < peaks.length; k++) { const r = resample(peaks[k - 1], peaks[k]); segs.push(r); for (let q = 0; q < L; q++) tmpl[q] += r[q]; cnt++; }
      for (let q = 0; q < L; q++) tmpl[q] /= cnt;
      let eh = 0, en = 0; for (let q = 0; q < L; q++) eh += tmpl[q] * tmpl[q];
      segs.forEach((r) => { for (let q = 0; q < L; q++) { const d = r[q] - tmpl[q]; en += d * d; } }); en /= segs.length;
      const hnr = 10 * Math.log10((eh || 1e-12) / (en || 1e-12));
      const meanF0 = sampleRate / meanT;
      const f0sd = Math.sqrt(periods.reduce((a, p) => a + (sampleRate / p - meanF0) ** 2, 0) / periods.length);
      const loudnessDb = 20 * Math.log10(longest.reduce((a, f) => a + f.rms, 0) / longest.length || 1e-9);
      return { voicedSeconds, maxPhonation: longest.length * 0.02, meanF0, f0sd, jitter, shimmer, hnr, loudnessDb, periods: periods.length,
        f0s: periods.map((p) => sampleRate / p), amps };
    }

    function VoiceTestCard() {
      const [phase, setPhase] = useState("idle");
      const [left, setLeft] = useState(VOICE_SECONDS);
      const [level, setLevel] = useState(0);
      const [result, setResult] = useState(null);
      const [note, setNote] = useState("");
      const [msg, setMsg] = useState("");
      const [history] = useJson("/api/observations?source=motor&metric=voice_hnr&limit=60", [phase]);
      const start = async () => {
        setMsg("");
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
        catch (e) { setMsg("Microphone access denied or unavailable (" + e.message + ")."); return; }
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        await ctx.resume();
        const src = ctx.createMediaStreamSource(stream);
        const proc = ctx.createScriptProcessor(2048, 1, 1);
        const chunks = [];
        proc.onaudioprocess = (e) => { const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); let s2 = 0; for (let i = 0; i < d.length; i++) s2 += d[i] * d[i]; setLevel(Math.sqrt(s2 / d.length)); };
        src.connect(proc); proc.connect(ctx.destination);
        setPhase("recording"); setLeft(VOICE_SECONDS);
        const t0 = performance.now();
        const tick = setInterval(() => setLeft(Math.max(0, Math.ceil(VOICE_SECONDS - (performance.now() - t0) / 1000))), 200);
        setTimeout(() => {
          clearInterval(tick); proc.disconnect(); src.disconnect(); stream.getTracks().forEach((t) => t.stop()); ctx.close();
          const total = chunks.reduce((a, c) => a + c.length, 0); const pcm = new Float32Array(total); let o = 0; chunks.forEach((c) => { pcm.set(c, o); o += c.length; });
          const res = analyzeVoice(pcm, ctx.sampleRate);
          if (!res || res.tooShort) { setPhase("idle"); setMsg(`Not enough voiced sound (${res ? res.voicedSeconds.toFixed(1) : 0} s). Hold a steady "ahh" close to the phone.`); return; }
          setResult(res); setPhase("done");
        }, VOICE_SECONDS * 1000 + 200);
      };
      const save = async () => {
        const ts = new Date().toISOString();
        const raw = { note: note || null, voicedSeconds: Number(result.voicedSeconds.toFixed(2)), maxPhonation: Number(result.maxPhonation.toFixed(2)) };
        const items = [["voice_f0", Number(result.meanF0.toFixed(1))], ["voice_f0_sd", Number(result.f0sd.toFixed(2))], ["voice_jitter_pct", Number((result.jitter * 100).toFixed(3))],
          ["voice_shimmer_pct", Number((result.shimmer * 100).toFixed(3))], ["voice_hnr", Number(result.hnr.toFixed(2))], ["voice_loudness_db", Number(result.loudnessDb.toFixed(1))]]
          .map(([metric, value]) => ({ ts, source: "motor", metric, value, raw }));
        const r = await apiFetch("/api/observations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(items) });
        if (r.ok) { setPhase("idle"); setResult(null); setNote(""); setMsg("Saved."); } else setMsg("Save failed.");
      };
      const flag = (ok) => <span style={{ color: ok ? "#a3e635" : "#fbbf24", fontSize: 10 }}>{ok ? "typical" : "high"}</span>;
      const hist = history ? [...history].reverse() : [];
      return (
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">Voice test</div>
              <div className="card-subtitle">Hold a steady "ahh" at a comfortable pitch and volume for 5 s, phone about 15 cm from your mouth, same quiet room each time.</div>
            </div>
          </div>
          {phase === "idle" && <div className="controls-row"><button type="button" className="pill-btn primary" onClick={start}>Start 5-second recording</button></div>}
          {phase === "recording" && (
            <div style={{ textAlign: "center", padding: "14px 0" }}>
              <div style={{ fontSize: 48, fontWeight: 700 }}>{left}</div>
              <div style={{ height: 8, background: "#0f172a", borderRadius: 4, margin: "8px 40px" }}><div style={{ height: 8, borderRadius: 4, background: "#a3e635", width: `${Math.min(100, level * 400)}%` }} /></div>
              <div className="card-subtitle">Say "ahhhh"…</div>
            </div>
          )}
          {phase === "done" && result && (
            <>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 6 }}>
                {[["Jitter", (result.jitter * 100).toFixed(2) + "%", flag(result.jitter < 0.0104)], ["Shimmer", (result.shimmer * 100).toFixed(2) + "%", flag(result.shimmer < 0.038)], ["HNR", result.hnr.toFixed(1) + " dB", flag(result.hnr > 15)],
                  ["Pitch", Math.round(result.meanF0) + " Hz"], ["Pitch spread", result.f0sd.toFixed(1) + " Hz"], ["Loudness", result.loudnessDb.toFixed(0) + " dBFS"]].map(([k, v, f]) => (
                  <div key={k} style={{ background: "#0f172a", borderRadius: 8, padding: "8px 10px" }}>
                    <div style={{ fontSize: 11, color: "#94a3b8" }}>{k} {f}</div>
                    <div style={{ fontSize: 16, fontWeight: 600 }}>{v}</div>
                  </div>
                ))}
              </div>
              <svg viewBox="0 0 600 60" style={{ width: "100%", height: 60, display: "block", marginTop: 8 }}>
                {(() => { const lo = Math.min(...result.f0s) * 0.95, hi = Math.max(...result.f0s) * 1.05; const x = (i) => 10 + (580 * i) / Math.max(1, result.f0s.length - 1); const y = (v) => 56 - (46 * (v - lo)) / (hi - lo || 1);
                  return <><text x="10" y="10" fontSize="10" fill="#64748b">pitch over time (Hz), voiced frames</text><path d={"M" + result.f0s.map((v, i) => `${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" L")} fill="none" stroke="#c084fc" strokeWidth="1.5" /></>; })()}
              </svg>
              <div className="card-subtitle">{result.voicedSeconds.toFixed(1)} s voiced · longest run {result.maxPhonation.toFixed(1)} s · {result.periods} glottal periods</div>
              <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>Period-based local jitter and shimmer (Praat-style) and HNR from a period-averaged template. Phone mic and room still matter, so your own history is the reference; "typical" marks use common thresholds (jitter 1.04%, shimmer 3.8%, HNR 15 dB) loosely.</div>
              <div className="controls-row" style={{ gap: 8, marginTop: 6 }}>
                <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (e.g. pre-dose)"
                  style={{ flex: 1, background: "#0f172a", color: "#e2e8f0", border: "1px solid #334155", borderRadius: 8, padding: "8px 10px", fontSize: 14 }} />
                <button type="button" className="pill-btn primary" onClick={save}>Save</button>
                <button type="button" className="pill-btn" onClick={() => { setPhase("idle"); setResult(null); }}>Discard</button>
              </div>
            </>
          )}

    // ---------- Spiral test: trace a 3-turn Archimedean spiral with a finger ----------
    const SPIRAL_TURNS = 3;
    function analyzeSpiral(points, cx, cy, R) {
      // Ideal spiral r = k·θ. The trace's absolute angle is unwrapped (ignoring the unstable centre), then the angular
      // offset is fitted so the ideal and the trace line up; residual r - k·θ is the deviation.
      if (points.length < 20) return null;
      const k = R / (2 * Math.PI * SPIRAL_TURNS);
      let prevA = null, theta = 0; const rows = [];
      for (const p of points) {
        const dx = p.x - cx, dy = p.y - cy; const r = Math.sqrt(dx * dx + dy * dy);
        if (r < 8) { rows.push({ t: p.t, r, theta: null }); continue; }
        const a = Math.atan2(dy, dx);
        if (prevA != null) { let d = a - prevA; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; theta += d; }
        prevA = a; rows.push({ t: p.t, r, theta });
      }
      const usable = rows.filter((q) => q.theta != null && q.r > 0.12 * R);
      if (usable.length < 10) return null;
      const offs = usable.map((q) => q.theta - q.r / k).sort((a, b) => a - b);
      const off = offs[Math.floor(offs.length / 2)];
      const scored = rows.filter((q) => q.theta != null).map((q) => ({ t: q.t, err: q.r - k * Math.max(0, q.theta - off), theta: q.theta - off }));
      const seconds = (points[points.length - 1].t - points[0].t) / 1000;
      const errAbs = scored.reduce((a, q) => a + Math.abs(q.err), 0) / scored.length;
      const thetas = scored.map((q) => q.theta);
      const coverage = (Math.max(...thetas) - Math.max(0, Math.min(...thetas))) / (2 * Math.PI * SPIRAL_TURNS);
      let len = 0; for (let i = 1; i < points.length; i++) len += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      const fs = 50, n = Math.floor(seconds * fs); let bandShare = 0, peakHz = 0;
      if (n > 50 && scored.length > 20) {
        const u = new Float64Array(n); let j = 0; const t0 = scored[0].t;
        for (let i = 0; i < n; i++) { const tt = t0 + (i / fs) * 1000; while (j < scored.length - 2 && scored[j + 1].t < tt) j++; const a = scored[j], b = scored[j + 1]; const w = b.t === a.t ? 0 : (tt - a.t) / (b.t - a.t); u[i] = a.err + (b.err - a.err) * w; }
        const mean = u.reduce((a, b) => a + b, 0) / n; for (let i = 0; i < n; i++) u[i] = (u[i] - mean) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1)));
        let total = 0, band = 0, pk = 0;
        for (let f = 1; f <= 15.001; f += 0.25) { let re = 0, im = 0; const kk = (2 * Math.PI * f) / fs; for (let i = 0; i < n; i++) { re += u[i] * Math.cos(kk * i); im -= u[i] * Math.sin(kk * i); } const pw = re * re + im * im; total += pw; if (f >= 3.5 && f <= 7.5) band += pw; if (pw > pk) { pk = pw; peakHz = f; } }
        bandShare = total ? band / total : 0;
      }
      return { seconds, errorPct: (errAbs / R) * 100, coverage: Math.min(1, coverage), speed: len / seconds / R, bandShare, peakHz, points: points.length };
    }

    function SpiralTestCard() {
      const [phase, setPhase] = useState("idle"); // idle | drawing | done
      const [hand, setHand] = useState(() => { try { return localStorage.getItem("pdm-spiral-hand") || "right"; } catch { return "right"; } });
      const [result, setResult] = useState(null);
      const [note, setNote] = useState("");
      const [msg, setMsg] = useState("");
      const canvasRef = useRef(null); const pts = useRef([]); const drawing = useRef(false);
      const [history] = useJson("/api/observations?source=motor&metric=spiral_error_pct&limit=60", [phase]);
      useEffect(() => { try { localStorage.setItem("pdm-spiral-hand", hand); } catch {} }, [hand]);
      const SIZE = 300, CX = 150, CY = 150, R = 130;
      const drawGuide = (ctx) => {
        ctx.clearRect(0, 0, SIZE, SIZE); ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, SIZE, SIZE);
        ctx.strokeStyle = "#334155"; ctx.lineWidth = 2; ctx.beginPath();
        const k = R / (2 * Math.PI * SPIRAL_TURNS);
        for (let th = 0; th <= 2 * Math.PI * SPIRAL_TURNS; th += 0.05) { const r = k * th; const x = CX + r * Math.cos(th), y = CY + r * Math.sin(th); th === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
        ctx.stroke(); ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(CX, CY, 5, 0, 2 * Math.PI); ctx.fill();
      };
      useEffect(() => { if (phase === "drawing" && canvasRef.current) drawGuide(canvasRef.current.getContext("2d")); }, [phase]);
      const pos = (e) => { const rect = canvasRef.current.getBoundingClientRect(); const sx = SIZE / rect.width; return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sx, t: performance.now() }; };
      const onDown = (e) => { e.preventDefault(); if (phase !== "drawing") return; drawing.current = true; pts.current = [pos(e)]; };
      const onMove = (e) => { e.preventDefault(); if (!drawing.current) return; const p = pos(e); const prev = pts.current[pts.current.length - 1]; pts.current.push(p);
        const ctx = canvasRef.current.getContext("2d"); ctx.strokeStyle = "#a3e635"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const onUp = (e) => { e.preventDefault(); if (!drawing.current) return; drawing.current = false;
        const res = analyzeSpiral(pts.current, CX, CY, R);
        if (!res || res.coverage < 0.5) { setMsg("Trace didn't get far enough around the spiral. Start at the blue dot and follow it out to the end in one stroke."); return; }
        setResult(res); setPhase("done"); setMsg(""); };
      const save = async () => {
        const ts = new Date().toISOString();
        const step = Math.max(1, Math.floor(pts.current.length / 200));
        const raw = { hand, note: note || null, coverage: Number(result.coverage.toFixed(2)), points: result.points, trace: pts.current.filter((_, i) => i % step === 0).map((p) => [Math.round(p.x), Math.round(p.y), Math.round(p.t - pts.current[0].t)]) };
        const items = [["spiral_error_pct", Number(result.errorPct.toFixed(2))], ["spiral_tremor_share", Number(result.bandShare.toFixed(4))], ["spiral_seconds", Number(result.seconds.toFixed(2))], ["spiral_speed", Number(result.speed.toFixed(4))]]
          .map(([metric, value]) => ({ ts, source: "motor", metric, value, raw }));
        const r = await apiFetch("/api/observations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(items) });
        if (r.ok) { setPhase("idle"); setResult(null); setNote(""); setMsg("Saved."); } else setMsg("Save failed.");
      };
      const hist = history ? [...history].reverse() : [];
      return (
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">Spiral test</div>
              <div className="card-subtitle">Start at the blue dot and trace the spiral outward in one continuous stroke with your index finger. Lift to finish.</div>
            </div>
          </div>
          {phase === "idle" && (
            <div className="controls-row" style={{ gap: 8 }}>
              {["left", "right"].map((h) => <button key={h} type="button" className={"pill-btn" + (hand === h ? " primary" : "")} onClick={() => setHand(h)}>{h} hand</button>)}
              <button type="button" className="pill-btn primary" onClick={() => { setMsg(""); setPhase("drawing"); }}>Start</button>
            </div>
          )}
          {phase === "drawing" && (
            <div style={{ display: "flex", justifyContent: "center", marginTop: 6 }}>
              <canvas ref={canvasRef} width={SIZE} height={SIZE} style={{ width: "min(300px, 90vw)", height: "auto", borderRadius: 12, touchAction: "none" }}
                onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} onPointerLeave={onUp} />
            </div>
          )}
          {phase === "done" && result && (
            <>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 6 }}>
                {[["Deviation (% radius)", result.errorPct.toFixed(1) + "%"], ["Tremor share", Math.round(result.bandShare * 100) + "%"], ["Time", result.seconds.toFixed(1) + " s"],
                  ["Peak", result.peakHz.toFixed(1) + " Hz"], ["Coverage", Math.round(result.coverage * 100) + "%"], ["Speed", result.speed.toFixed(2) + " R/s"]].map(([k, v]) => (
                  <div key={k} style={{ background: "#0f172a", borderRadius: 8, padding: "8px 10px" }}>
                    <div style={{ fontSize: 11, color: "#94a3b8" }}>{k}</div>

                  </div>
                ))}
              </div>
              <div style={{ fontSize: 10, color: "#64748b", marginTop: 6 }}>Deviation = mean distance from the ideal spiral. Tremor share = fraction of the wobble around the ideal path in the 3.5–7.5 Hz band. Finger-on-glass is noisier than pen-on-tablet; compare against your own history.</div>
              <div className="controls-row" style={{ gap: 8, marginTop: 6 }}>
                <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (e.g. pre-dose)"
                  style={{ flex: 1, background: "#0f172a", color: "#e2e8f0", border: "1px solid #334155", borderRadius: 8, padding: "8px 10px", fontSize: 14 }} />

              </div>
            </>

          {msg && <div className="card-subtitle" style={{ marginTop: 6, color: msg === "Saved." ? "#a3e635" : "#f87171" }}>{msg}</div>}
          {hist.length > 1 && (

              <svg viewBox="0 0 600 60" style={{ width: "100%", height: 60, display: "block" }}>
                {(() => { const vals = hist.map((h) => h.value); const hi = Math.max(10, ...vals); const x = (i) => 10 + (580 * i) / Math.max(1, hist.length - 1); const y = (v) => 52 - (46 * v) / hi;
                  return <><path d={"M" + hist.map((h, i) => `${x(i).toFixed(1)} ${y(h.value).toFixed(1)}`).join(" L")} fill="none" stroke="#fbbf24" strokeWidth="1.5" />

            </div>

    }

    function TrendsCard() {

      // fetch a couple of extra days so a lag has something to shift in from
      const url = `/api/daily?days=${span + 2}` + (pick ? `&source=${encodeURIComponent(src)}&metric=${encodeURIComponent(met)}` : "");
      const [raw, err] = useJson(url, [span, pick]);
      const rows = useMemo(() => {
        if (!raw) return null;
        const shifted = raw.map((r, i) => {
          const srcRow = raw[i + lag]; // lag -1 -> yesterday's metric on today's row
          return { ...r, metric_value: srcRow ? srcRow.metric_value : null };
        });
        return shifted.slice(2);
      }, [raw, lag]);
      const corr = useMemo(() => {
        if (!rows || !pick) return null;
        return spearman(rows.filter((r) => r.qol != null && r.metric_value != null).map((r) => [Number(r.metric_value), Number(r.qol)]));
      }, [rows, pick]);
      const rated = rows ? rows.filter((r) => r.qol != null) : [];
      const meanQol = rated.length ? (rated.reduce((a, r) => a + Number(r.qol), 0) / rated.length).toFixed(2) : "–";

          {rows && (

              ]} />
              <DualAxisChart

    function QoLSummaryCard({ days, onCellClick, selectedKey }) {
