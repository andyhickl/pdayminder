<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDayMinder</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDayMinder">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- React + Babel from CDN -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0c1116;
      --card-bg: #111827;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e5e7eb;
      --muted: #6b7280;
      --border: #1f2933;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #root {
      width: 100%;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: 11px;
      color: var(--muted);
    }

    .icon-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(15, 23, 42, 0.95);
    }

    .icon-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .card {
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 55%),
                  var(--card-bg);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 10px 12px 12px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--muted);
    }

    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .day-nav-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      padding: 4px 8px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .day-nav-btn:hover {
      background: rgba(15, 23, 42, 1);
    }

    .day-nav-date {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
      text-decoration: underline dotted var(--muted);
      text-underline-offset: 3px;
    }
    .day-nav-date input[type="date"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 16px; /* keeps iOS from zooming */
    }
    .mini-cal-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mini-cal-nav button {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.4;
    }
    .mini-cal-nav button.today {
      font-size: 11px;
      color: var(--muted);
    }
    .mini-cal-month {
      min-width: 110px;
      text-align: center;
      font-weight: 600;
    }

    .mini-calendar {
      margin-top: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 6px;
      background: rgba(15, 23, 42, 0.8);
      font-size: 11px;
    }

    .mini-cal-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 4px;
    }
    .mini-cal-header .mini-cal-nav:last-child {
      justify-content: flex-end;
    }

    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .mini-cal-dayname {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      padding-bottom: 2px;
    }

    .mini-cal-cell {
      text-align: center;
      padding: 3px 0;
      border-radius: 999px;
      cursor: pointer;
      position: relative;
    }

    .mini-cal-cell.disabled {
      opacity: 0.25;
      cursor: default;
    }

    .mini-cal-cell.selected {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
    }

    .mini-cal-cell.today {
      border: 1px dashed var(--accent);
    }

    .mini-cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--accent);
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
    }

    .ring-container {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .ring-wrapper {
      width: 100%;
      max-width: 320px;
    }

    .ring-caption {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    .ring-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 8px 0 4px; font-size: 11px; color: var(--muted); }
    .ring-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .ring-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .pill-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .pill-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pill-btn:hover {
      background: rgba(15, 23, 42, 1);
    }

    .med-list {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .med-list span {
      color: var(--text);
    }

    .settings-card {
      margin-top: 4px;
      font-size: 12px;
    }

    .settings-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .settings-row label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .settings-input {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }

    .settings-help {
      font-size: 11px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 12px;
      width: min(420px, calc(100% - 24px));
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .modal-body {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
    }

    .face-display {
      font-size: 24px;
      width: 34px;
      text-align: center;
    }

    .checkbox-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-secondary, .btn-primary {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(15, 23, 42, 1);
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-primary:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    .quick-times {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .quick-time-pill {
      border-radius: 999px;
      border: 1px dashed var(--border);
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
      color: var(--muted);
    }

    .quick-time-pill:hover {
      border-style: solid;
      color: var(--text);
    }

    /* ---------- tabs & sections ---------- */
    .app-shell { padding-bottom: 84px; }
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: center; gap: 2px;
      background: rgba(15, 23, 42, 0.96); border-top: 1px solid var(--border);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px);
    }
    .tab {
      flex: 1; max-width: 110px; background: none; border: 0; color: var(--muted); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; font-size: 11px;
    }
    .tab-icon { font-size: 18px; line-height: 1; }
    .tab.active { color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
    @media (min-width: 720px) {
      .tabbar { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--border); border-radius: 12px; margin-bottom: 4px; }
      .app-shell { padding-bottom: 24px; }
      .tab { flex-direction: row; gap: 6px; font-size: 13px; }
    }
    .section { display: flex; flex-direction: column; gap: 12px; }
    .section-head {
      width: 100%; text-align: left; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .section-title { font-size: 15px; font-weight: 700; }
    .section-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .section-chev { color: var(--muted); font-size: 14px; }
    .section-body { display: flex; flex-direction: column; gap: 12px; }
    .stats-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .stat { background: rgba(15, 23, 42, 0.55); border-radius: 10px; padding: 8px 10px; }
    .stat-top { display: grid; grid-template-columns: 1fr auto 90px; gap: 10px; align-items: center; }
    .stat-last { font-size: 20px; font-weight: 700; }
    .stat-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
    .stat-chip { display: flex; flex-direction: column; align-items: center; font-size: 12px; background: rgba(2, 6, 23, 0.5); border-radius: 6px; padding: 3px 2px; }
    .stat-chip span { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stats-label { font-size: 13px; }
    .stats-n { font-size: 10px; color: var(--muted); }

    .footer-note {
      margin-top: 8px;
      font-size: 10px;
      text-align: center;
      color: var(--muted);
    }

    /* QoL summary card */
    .summary-card {
      margin-top: 4px;
    }

    .summary-chart {
      margin-top: 4px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2px;
      padding: 4px 2px;
    }

    .matrix-cell {
      width: 100%;
      padding-bottom: 60%;
      border-radius: 3px;
      background: #000000;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.7);
      cursor: pointer;
    }
    .matrix-cell:hover { box-shadow: 0 0 0 2px #38bdf8; }
    .matrix-cell.selected-day { box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.55); }
    .matrix-cell.future { cursor: default; opacity: 0.5; }
    .matrix-cell { position: relative; }
    .matrix-cell .ev-mark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000; pointer-events: none; }
    .matrix-cell.future:hover { box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.7); }
    .qol-bars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      align-items: end;
      max-width: 220px;
    }
    .qol-bar-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .qol-bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
    .qol-bar-count { font-size: 10px; color: var(--muted); height: 12px; }
    .qol-bar-label { font-size: 10px; color: var(--muted); }
    .matrix-vnav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }
    .matrix-vnav button {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      min-height: 28px;
    }
    .matrix-vnav button.today { color: #38bdf8; font-size: 16px; }
    .matrix-vnav button:disabled { opacity: 0.3; cursor: default; }

    .summary-legend {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
    }

    .summary-legend strong {
      color: var(--text);
    }

    .data-card {
      margin-top: 4px;
      font-size: 12px;
    }

    .data-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .data-actions button {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      cursor: pointer;
    }

    .data-actions button:hover {
      background: rgba(15, 23, 42, 1);
    }

    .data-note {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 400px) {
      .settings-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ---------- API ----------
    // Auth is a session cookie set by /login. On 401 the session expired: go sign in.
    // Active test battery (pre/post-dose). Test cards don't know about it: apiFetch tags their saves and advances it.
    const sessionRef = { current: null, onSaved: null };
    const TEST_KIND = (metric) => metric.startsWith("tremor_") ? "tremor" : metric.startsWith("tap_") ? "tap" : metric.startsWith("ddk_") ? "ddk" : metric.startsWith("gait_") ? "gait" : metric.startsWith("balance_") ? "balance" : metric.startsWith("spiral_") ? "spiral" : metric.startsWith("voice_mpt") ? "mpt" : metric.startsWith("voice_") ? "voice" : metric.startsWith("read_") ? "read" : null;
    window.__pdm = { apiFetch: (...a) => apiFetch(...a) }; // for scripted tests
    async function apiFetch(url, opts = {}) {
      let body = opts.body, kind = null;
      if (url === "/api/observations" && opts.method === "POST" && typeof body === "string" && sessionRef.current) {
        try {
          const items = JSON.parse(body);
          if (Array.isArray(items) && items.length && items[0].source === "motor") {
            kind = TEST_KIND(items[0].metric);
            items.forEach((it) => { it.raw = { ...(it.raw || {}), battery: sessionRef.current.phase, session_id: sessionRef.current.id }; });
            body = JSON.stringify(items);
          }
        } catch {}
      }
      const res = await fetch(url, { ...opts, body, credentials: "same-origin" });
      if (res.status === 401) window.location.href = "/login";
      if (res.ok && kind && sessionRef.onSaved) sessionRef.onSaved(kind);
      return res;
    }

    // ---------- Medications ----------
    // settings.medications: [{id, name, dose, dopaminergic, times: ["HH:MM", ...]}]. Older settings had medTimes (3 slots).
    function normalizeMedications(settings) {
      if (settings && Array.isArray(settings.medications) && settings.medications.length) {
        return settings.medications.map((m) => ({ id: m.id || slug(m.name), name: m.name || m.id, dose: m.dose || "", dopaminergic: Boolean(m.dopaminergic), times: Array.isArray(m.times) ? m.times.filter(Boolean) : [] }));
      }
      const times = settings && Array.isArray(settings.medTimes) ? settings.medTimes.filter(Boolean) : ["08:00", "12:00", "16:00"];
      return [{ id: "sinemet", name: "Sinemet", dose: "25/100", dopaminergic: true, times }, { id: "rasagiline", name: "Rasagiline", dose: "1 mg", dopaminergic: false, times: ["08:00"] }];
    }
    const slug = (name) => String(name || "med").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "med";
    // A logged dose is {t: "HH:MM", drug: id}. Older data stored plain "HH:MM" strings (always Sinemet).
    const medT = (m) => (typeof m === "string" ? m : m.t);
    const medDrug = (m) => (typeof m === "string" ? "sinemet" : m.drug || "sinemet");
    const normalizeMeds = (arr) => { const seen = new Set(); return (arr || []).map((m) => ({ t: medT(m), drug: medDrug(m) })).filter((m) => m.t && !seen.has(m.t + "|" + m.drug) && seen.add(m.t + "|" + m.drug)).sort((a, b) => a.t.localeCompare(b.t)); };
    const normalizeSupps = (arr) => { const seen = new Set(); return (arr || []).map((x) => ({ t: x && x.t, id: x && x.id })).filter((x) => x.t && x.id && !seen.has(x.t + "|" + x.id) && seen.add(x.t + "|" + x.id)).sort((a, b) => a.t.localeCompare(b.t)); };
    const normalizeSupplements = (settings) => (settings && Array.isArray(settings.supplements) ? settings.supplements : []).map((x) => ({ id: x.id || slug(x.name), name: x.name || x.id, dose: x.dose || "", times: Array.isArray(x.times) ? x.times.filter(Boolean) : [] }));
    const suppName = (settings, id) => { const x = (settings.supplements || []).find((y) => y.id === id); return x ? x.name : id; };
    const isDopa = (settings, drug) => { const m = (settings.medications || []).find((x) => x.id === drug); return m ? m.dopaminergic : drug === "sinemet"; };
    const medName = (settings, drug) => { const m = (settings.medications || []).find((x) => x.id === drug); return m ? m.name : drug; };
    // Dose state for a moment on a day: post-dose = 30 min–3.5 h after the latest dopaminergic dose; ramp = under 30 min; pre = otherwise.
    const DOSE_POST_MIN = 30, DOSE_POST_MAX = 210;
    function doseState(day, settings, minuteOfDay) {
      const dopa = normalizeMeds(day && day.meds).filter((m) => isDopa(settings, m.drug)).map((m) => { const [h, mm] = m.t.split(":").map(Number); return h * 60 + mm; }).filter((t) => t <= minuteOfDay);
      if (!dopa.length) return { state: "pre", minutesSinceDose: null };
      const since = minuteOfDay - Math.max(...dopa);
      return { state: since < DOSE_POST_MIN ? "ramp" : since <= DOSE_POST_MAX ? "post" : "pre", minutesSinceDose: since };
    }
    function DoseStateLine() {
      const c = doseContextNow(); if (!c) return null;
      const label = c.dose_state === "post" ? `post-dose (${Math.round(c.minutes_since_dose)} min after the last levodopa dose)` : c.dose_state === "ramp" ? `ramping (${Math.round(c.minutes_since_dose)} min after dose; counts as neither)` : c.minutes_since_dose == null ? "pre-dose (no levodopa logged yet today)" : `pre-dose (${Math.round(c.minutes_since_dose)} min since last levodopa dose)`;
      return <div style={{ fontSize: 11, color: c.dose_state === "post" ? "#a3e635" : "#fbbf24", marginTop: 6 }}>Will be tagged {label}. Log doses first if that's wrong.</div>;
    }
    // Tests call this at save time; App keeps the ref current.
    const doseCtxRef = { current: null };
    function doseContextNow(at) {
      const c = doseCtxRef.current; if (!c) return { dose_state: "pre", minutes_since_dose: null, dose_time: null };
      const now = at && !isNaN(at) ? at : new Date(); const key = toDateKey(now);
      const r = doseState(c.days[key], c.settings, now.getHours() * 60 + now.getMinutes());
      const doseMin = r.minutesSinceDose == null ? null : now.getHours() * 60 + now.getMinutes() - r.minutesSinceDose;
      return { dose_state: r.state, minutes_since_dose: r.minutesSinceDose, dose_time: doseMin == null ? null : minutesToTimeString(doseMin) };
    }

    // ---------- Utilities ----------
    function toDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatPrettyDate(date) {
      return date.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
      });
    }

    function parseTimeToMinutes(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      if (Number.isNaN(h) || Number.isNaN(m)) return 0;
      return h * 60 + m;
    }

    function minutesToTimeString(mins) {
      let m = mins % (24 * 60);
      if (m < 0) m += 24 * 60;
      const h = Math.floor(m / 60);
      const mm = m % 60;
      return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function isMinuteInSleep(minute, settings) {
      const start = parseTimeToMinutes(settings.sleepStart);
      const end = parseTimeToMinutes(settings.sleepEnd);
      if (start === end) return false;
      if (start < end) {
        return minute >= start && minute < end;
      } else {
        return minute >= start || minute < end;
      }
    }

    // ---------- Colors & faces ----------
    function ratingColor(rating) {
      switch (rating) {
        case 1: return "#ef4444";
        case 2: return "#f97316";
        case 3: return "#eab308";
        case 4: return "#22c55e";
        case 5: return "#0ea5e9"; // blue
        default: return "#374151";
      }
    }

    function faceForRating(r) {
      switch (r) {
        case 1: return "😫";
        case 2: return "😟";
        case 3: return "😐";
        case 4: return "🙂";
        case 5: return "😄";
        default: return "🙂";
      }
    }

    // ---------- Donut path ----------
    function describeDonutSegment(cx, cy, rInner, rOuter, startAngle, endAngle) {
      const x0 = cx + rOuter * Math.cos(startAngle);
      const y0 = cy + rOuter * Math.sin(startAngle);
      const x1 = cx + rOuter * Math.cos(endAngle);
      const y1 = cy + rOuter * Math.sin(endAngle);
      const x2 = cx + rInner * Math.cos(endAngle);
      const y2 = cy + rInner * Math.sin(endAngle);
      const x3 = cx + rInner * Math.cos(startAngle);
      const y3 = cy + rInner * Math.sin(startAngle);
      const largeArc = endAngle - startAngle <= Math.PI ? 0 : 1;

      return [
        "M", x0, y0,
        "A", rOuter, rOuter, 0, largeArc, 1, x1, y1,
        "L", x2, y2,
        "A", rInner, rInner, 0, largeArc, 0, x3, y3,
        "Z"
      ].join(" ");
    }

    // ---------- Defaults ----------
    const DEFAULT_SETTINGS = {
      sleepStart: "23:00",
      sleepEnd: "06:00",
      medications: [
        { id: "sinemet", name: "Sinemet", dose: "25/100", dopaminergic: true, times: ["08:00", "12:00", "16:00"] },
        { id: "rasagiline", name: "Rasagiline", dose: "1 mg", dopaminergic: false, times: ["08:00"] },
      ],
    };

    // ---------- Local storage ----------
    function loadSettingsFromLocal() {
      try {
        const raw = localStorage.getItem("pdayminder-settings");
        if (!raw) return DEFAULT_SETTINGS;
        const parsed = JSON.parse(raw);
        return {
          sleepStart: parsed.sleepStart || DEFAULT_SETTINGS.sleepStart,
          sleepEnd: parsed.sleepEnd || DEFAULT_SETTINGS.sleepEnd,
          medications: normalizeMedications(parsed),
        };
      } catch {
        return DEFAULT_SETTINGS;
      }
    }

    function saveSettingsToLocal(settings) {
      localStorage.setItem("pdayminder-settings", JSON.stringify(settings));
    }

    function loadDaysFromLocal() {
      try {
        const raw = localStorage.getItem("pdayminder-days");
        if (!raw) return {};
        const parsed = JSON.parse(raw) || {};
        Object.values(parsed).forEach((d) => { if (d) { d.meds = normalizeMeds(d.meds); d.supps = normalizeSupps(d.supps); } });
        return parsed;
      } catch {
        return {};
      }
    }

    function saveDaysToLocal(days) {
      localStorage.setItem("pdayminder-days", JSON.stringify(days));
    }

    // ---------- CSV export/import ----------
    function exportDaysToCSV(days) {
      const header = "date,recordType,segmentIndex,segmentType,rating,medTime,drug";
      const rows = [header];
      const keys = Object.keys(days).sort();

      for (const dateKey of keys) {
        const day = days[dateKey];
        if (!day) continue;
        day.segments.forEach((seg, idx) => {
          const segmentType = seg.type || "empty";
          const rating = seg.rating != null ? seg.rating : "";
          rows.push([
            dateKey,
            "segment",
            idx,
            segmentType,
            rating,
            ""
          ].join(","));
        });
        normalizeMeds(day.meds).forEach((m) => {
          rows.push([dateKey, "med", "", "", "", m.t, m.drug].join(","));
        });
      }
      return rows.join("\n");
    }

    function importDaysFromCSV(text, settings) {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return {};
      const [, ...rows] = lines;
      const imported = {};

      for (const line of rows) {
        if (!line.trim()) continue;
        const cols = line.split(",").map(c => c.trim());
        const [dateKey, recordType, segmentIndexStr, segmentType, ratingStr, medTime, drug] = cols;
        if (!dateKey || !recordType) continue;

        if (!imported[dateKey]) {
          imported[dateKey] = createEmptyDay(dateKey, settings);
        }
        const day = imported[dateKey];

        if (recordType === "segment") {
          const idx = parseInt(segmentIndexStr, 10);
          if (Number.isNaN(idx) || idx < 0 || idx >= day.segments.length) continue;
          const seg = { ...day.segments[idx] };
          seg.type = segmentType || "empty";
          seg.rating = ratingStr ? parseInt(ratingStr, 10) : 3;
          day.segments[idx] = seg;
        } else if (recordType === "med" && medTime) {
          day.meds.push({ t: medTime, drug: drug || "sinemet" });
        }
      }

      for (const key in imported) {
        imported[key].meds = normalizeMeds(imported[key].meds);
      }
      return imported;
    }

    // ---------- Day model ----------
    function createEmptyDay(dateKey, settings) {
      const segments = Array.from({ length: 12 }, (_, idx) => ({
        type: "empty",
        rating: 3,
      }));
      segments.forEach((seg, idx) => {
        const midMinute = idx * 120 + 60;
        if (isMinuteInSleep(midMinute, settings)) {
          seg.type = "sleep";
        }
      });
      return { dateKey, segments, meds: [], supps: [] };
    }

    // ---------- Components ----------
    function MiniCalendar({ selectedDate, daysWithData, onSelect }) {
      const todayKey = toDateKey(new Date());
      const selectedKey = toDateKey(selectedDate);
      // The month shown is independent of the selected day, so you can page around without losing your place.
      const [view, setView] = useState(() => new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1));
      useEffect(() => {
        setView(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1));
      }, [selectedKey]);
      const shiftMonth = (n) => setView((v) => new Date(v.getFullYear(), v.getMonth() + n, 1));

      const firstOfMonth = view;
      const firstDayIndex = firstOfMonth.getDay();
      const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();

      const weeks = [];
      let currentDay = 1;
      let started = false;

      for (let week = 0; week < 6; week++) {
        const row = [];
        for (let dow = 0; dow < 7; dow++) {
          if (!started && dow === firstDayIndex) {
            started = true;
          }
          if (!started || currentDay > daysInMonth) {
            row.push(null);
          } else {
            row.push(currentDay);
            currentDay++;
          }
        }
        weeks.push(row);
      }

      const dayNames = ["S", "M", "T", "W", "T", "F", "S"];

      return (
        <div className="mini-calendar">
          <div className="mini-cal-header">
            <div />
            <div className="mini-cal-nav">
              <button type="button" onClick={() => shiftMonth(-1)} aria-label="Previous month">‹</button>
              <span className="mini-cal-month">{view.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</span>
              <button type="button" onClick={() => shiftMonth(1)} aria-label="Next month">›</button>
            </div>
            <div className="mini-cal-nav">
              <button type="button" className="today" onClick={() => onSelect(new Date())}>Today</button>
            </div>
          </div>
          <div className="mini-cal-grid">
            {dayNames.map((d) => (
              <div key={d} className="mini-cal-dayname">{d}</div>
            ))}
            {weeks.map((row, ri) =>
              row.map((d, di) => {
                if (!d) {
                  return <div key={`${ri}-${di}`} className="mini-cal-cell disabled"></div>;
                }
                const dateObj = new Date(view.getFullYear(), view.getMonth(), d);
                const key = toDateKey(dateObj);
                const hasData = daysWithData.includes(key);
                const isSelected = key === selectedKey;
                const isToday = key === todayKey;
                const cls = [
                  "mini-cal-cell",
                  isSelected ? "selected" : "",
                  isToday ? "today" : "",
                ].join(" ");
                return (
                  <div
                    key={`${ri}-${di}`}
                    className={cls}
                    onClick={() => onSelect(dateObj)}
                  >
                    {d}
                    {hasData && <div className="mini-cal-dot"></div>}
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function DayRing({ day, onSegmentClick, settings: ringSettings, events, context }) {
      const width = 300;
      const height = 300;
      const cx = width / 2;
      const cy = height / 2;
      const rOuter = 105;
      const rInner = 70;
      const segmentCount = 12;
      const segments = day.segments;

      function angleForTimeStr(timeStr) {
        const minutes = parseTimeToMinutes(timeStr);
        const fraction = minutes / (24 * 60);
        return fraction * Math.PI * 2 - Math.PI / 2;
      }

      return (
        <div className="ring-wrapper">
          <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", display: "block" }}>
            {segments.map((seg, idx) => {
              const startFrac = idx / segmentCount;
              const endFrac = (idx + 1) / segmentCount;
              const startAngle = startFrac * Math.PI * 2 - Math.PI / 2;
              const endAngle = endFrac * Math.PI * 2 - Math.PI / 2;

              let fill = "#1f2933";
              if (seg.type === "rating") fill = ratingColor(seg.rating);
              else if (seg.type === "sleep") fill = "#4b5563";
              else if (seg.type === "noData") fill = "#374151";
              else fill = "#111827";

              const path = describeDonutSegment(cx, cy, rInner, rOuter, startAngle, endAngle);
              const midAngle = (startAngle + endAngle) / 2;
              const iconRadius = (rInner + rOuter) / 2;
              const tx = cx + iconRadius * Math.cos(midAngle);
              const ty = cy + iconRadius * Math.sin(midAngle) + 4;

              let icon = "";
              if (seg.type === "sleep") icon = "😴";
              if (seg.type === "noData") icon = "?";

              const startHour = idx * 2;
              const endHour = startHour + 2;
              const label = `${String(startHour).padStart(2,"0")}:00–${String(endHour).padStart(2,"0")}:00`;

              return (
                <g key={idx} onClick={() => onSegmentClick(idx, label)}>
                  <path d={path} fill={fill} stroke="#020617" strokeWidth="1" />
                  {icon && (
                    <text
                      x={tx}
                      y={ty}
                      fontSize="12"
                      textAnchor="middle"
                      fill="#e5e7eb"
                    >
                      {icon}
                    </text>
                  )}
                </g>
              );
            })}

            {segments.map((_, idx) => {
              const startFrac = idx / segmentCount;
              const angle = startFrac * Math.PI * 2 - Math.PI / 2;
              const labelRadius = rOuter + 10;
              const x = cx + labelRadius * Math.cos(angle);
              const y = cy + labelRadius * Math.sin(angle) + 3;
              const startHour = idx * 2;
              const label = `${String(startHour).padStart(2, "0")}:00`;
              return (
                <text
                  key={`time-label-${idx}`}
                  x={x}
                  y={y}
                  fontSize="9"
                  textAnchor="middle"
                  fill="#9ca3af"
                >
                  {label}
                </text>
              );
            })}

            <circle cx={cx} cy={cy} r={rInner - 10} fill="#020617" />
            <text x={cx} y={cy - 4} textAnchor="middle" fontSize="11" fill="#9ca3af">
              QoL 1–5
            </text>
            <text x={cx} y={cy + 10} textAnchor="middle" fontSize="10" fill="#6b7280">
              tap a segment to rate QoL
            </text>

            <defs>
              <pattern id="ctx-driving" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                <rect width="6" height="6" fill="#334155" /><rect width="2.5" height="6" fill="#cbd5e1" />
              </pattern>
            </defs>
            {(context || []).map((seg, i) => {
              // Context band on the inner edge of the wheel, in grays: home dark, work light, driving hatched, out = nothing.
              // White ticks mark where a segment starts and stops. Event arcs draw on top of this.
              if (seg.place === "out" || seg.place === "driving") return null; // driving shows as the gap between places
              const span = contextSpanOnDay(seg, day.dateKey); if (!span || span[1] - span[0] < 3) return null;
              const a0 = (span[0] / 1440) * Math.PI * 2 - Math.PI / 2, a1 = (span[1] / 1440) * Math.PI * 2 - Math.PI / 2;
              const rI = rInner - 9, rO = rInner - 2; const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
              const big = a1 - a0 > Math.PI ? 1 : 0;
              const [i0x, i0y] = p(rI, a0), [i1x, i1y] = p(rI, a1), [o0x, o0y] = p(rO, a0), [o1x, o1y] = p(rO, a1);
              const d = `M ${o0x.toFixed(1)} ${o0y.toFixed(1)} A ${rO} ${rO} 0 ${big} 1 ${o1x.toFixed(1)} ${o1y.toFixed(1)} L ${i1x.toFixed(1)} ${i1y.toFixed(1)} A ${rI} ${rI} 0 ${big} 0 ${i0x.toFixed(1)} ${i0y.toFixed(1)} Z`;
              const tick = (a, k) => { const [x1, y1] = p(rI - 1, a), [x2, y2] = p(rO + 1, a); return <line key={k} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#e2e8f0" strokeWidth="1" opacity="0.6" />; };
              return (
                <g key={"ctx" + i}>
                  <path d={d} fill={PLACE_COLORS[seg.place] || "#1e3a6e"} opacity="0.95" />
                  {span[0] > 0 && tick(a0, "s")}{span[1] < 1440 && tick(a1, "e")}
                  <title>{PLACE_LABELS[seg.place] || seg.place} {fmtEventTime(seg.start)}–{fmtEventTime(seg.end)}</title>
                </g>
              );
            })}
            {(() => {
              // Markers: dose rays (blue), supplement rays (yellow), event arcs + rays (red). Labels sit in bubbles on two
              // rings outside the wheel; when two labels would collide, the lower-priority one moves out, then is dropped.
              const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
              const angleOfMin = (min) => (min / 1440) * Math.PI * 2 - Math.PI / 2;
              const markers = [];
              normalizeMeds(day.meds).forEach((m, i) => {
                const dopa = isDopa(ringSettings, m.drug);
                markers.push({ key: `med-${i}`, kind: dopa ? "dose" : "othermed", angle: angleForTimeStr(m.t), label: m.t, color: dopa ? "#38bdf8" : "#94a3b8", priority: dopa ? 0 : 3, title: `${medName(ringSettings, m.drug)} ${m.t}` });
              });
              normalizeSupps(day.supps).forEach((x, i) => {
                markers.push({ key: `supp-${i}`, kind: "supp", angle: angleForTimeStr(x.t), label: x.t, color: "#facc15", priority: 2, title: `${suppName(ringSettings, x.id)} ${x.t}` });
              });
              const arcs = [];
              (events || []).forEach((e, i) => {
                const span = eventSpanOnDay(e, day.dateKey); if (!span) return;
                const a0 = angleOfMin(span[0]), a1 = angleOfMin(Math.max(span[1], span[0] + 8));
                arcs.push({ key: `ev-${i}`, a0, a1, ongoing: !e.end, title: `${eventLabel(e.type)} ${e.severity}/5 · ${fmtEventTime(e.start)}–${e.end ? fmtEventTime(e.end) : "ongoing"}` });
                markers.push({ key: `ev-${i}-s`, kind: "event", angle: a0, label: fmtEventTime(e.start).replace(/\s?[AP]M/i, ""), color: "#ef4444", priority: 1, title: arcs[arcs.length - 1].title });
                if (e.end) markers.push({ key: `ev-${i}-e`, kind: "event", angle: a1, label: fmtEventTime(e.end).replace(/\s?[AP]M/i, ""), color: "#ef4444", priority: 1, title: arcs[arcs.length - 1].title });
              });
              // Label placement: by priority, two rings, minimum angular gap scaled by radius so bubbles don't overlap.
              const rings = [rOuter + 24, rOuter + 38];
              const placed = [[], []];
              const norm = (a) => Math.atan2(Math.sin(a), Math.cos(a));
              const gapOk = (ring, a) => placed[ring].every((b) => Math.abs(norm(a - b)) * rings[ring] > 34);
              [...markers].sort((a, b) => a.priority - b.priority).forEach((m) => {
                if (m.kind === "othermed") return; // dots only
                const ring = gapOk(0, m.angle) ? 0 : gapOk(1, m.angle) ? 1 : -1;
                m.ring = ring; if (ring >= 0) placed[ring].push(m.angle);
              });
              const rArc = rInner - 5;
              return (
                <>
                  {arcs.map((e) => {
                    const [ax0, ay0] = p(rArc, e.a0), [ax1, ay1] = p(rArc, e.a1);
                    const d = `M ${ax0.toFixed(1)} ${ay0.toFixed(1)} A ${rArc} ${rArc} 0 ${e.a1 - e.a0 > Math.PI ? 1 : 0} 1 ${ax1.toFixed(1)} ${ay1.toFixed(1)}`;
                    const ray = (a, k) => { const [x1, y1] = p(rArc, a), [x2, y2] = p(rOuter + 6, a); return <line key={k} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#ef4444" strokeWidth="1.5" opacity="0.9" />; };
                    return <g key={e.key}><path d={d} fill="none" stroke="#ef4444" strokeWidth="4" strokeLinecap="round" opacity="0.95" />{ray(e.a0, "s")}{!e.ongoing && ray(e.a1, "e")}<title>{e.title}</title></g>;
                  })}
                  {markers.map((m) => {
                    if (m.kind === "othermed") { const [rx, ry] = p(rOuter + 6, m.angle); return <g key={m.key}><circle cx={rx} cy={ry} r="3" fill="#94a3b8" opacity="0.9"><title>{m.title}</title></circle></g>; }
                    if (m.kind === "event") return null; // rays drawn with the arc
                    const [x1, y1] = p(m.kind === "supp" ? rInner * 0.6 : rInner * 0.4, m.angle), [x2, y2] = p(rOuter * 1.05, m.angle);
                    return <line key={m.key} x1={x1} y1={y1} x2={x2} y2={y2} stroke={m.color} strokeWidth={m.kind === "supp" ? 1.5 : 2} strokeLinecap="round" opacity="0.9"><title>{m.title}</title></line>;
                  })}
                  {markers.map((m) => {
                    if (m.ring == null || m.ring < 0) return null;
                    const [lx, ly] = p(rings[m.ring], m.angle);
                    const w = m.label.length * 5.4 + 8, h = 13;
                    return (
                      <g key={m.key + "-l"}>
                        <rect x={lx - w / 2} y={ly - h / 2} width={w} height={h} rx="6" fill="#020617" stroke={m.color} strokeWidth="1" />
                        <text x={lx} y={ly + 3.5} fontSize="9" textAnchor="middle" fill={m.color}>{m.label}</text>
                        <title>{m.title}</title>
                      </g>
                    );
                  })}
                </>
              );
            })()}
          </svg>
        </div>
      );
    }

        let newSeg;
        if (sleep) newSeg = { type: "sleep", rating };

                />

    // [startMin, endMin] of an event clipped to the local day `key`, or null if it doesn't touch that day. Ongoing = until now.

    // When do events happen relative to the last levodopa dose? Diphasic patterns cluster early (ramp) and late (wearing off);

    // ---------- Test batteries ----------

    // ---------- Trends (server rollups + inline SVG) ----------
    function useJson(url, deps) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let alive = true;
        if (!url) return () => {};

          .then((d) => alive && setData(d)).catch((e) => alive && setErr(String(e)));

    // Two series, shared x (days), independent y axes. Left = primary, right = overlay. Bars = optional counts.
    function DualAxisChart({ rows, left, right, bars, height = 150 }) {
      const W = 600, H = height, padL = 32, padR = right ? 36 : 10, padT = 8, padB = 20;
      const n = rows.length;
      const x = (i) => padL + (n <= 1 ? 0 : (i * (W - padL - padR)) / (n - 1));
      const series = (cfg) => {
        if (!cfg) return null;
        const vals = rows.map((r) => (r[cfg.key] == null ? null : Number(r[cfg.key])));
        const present = vals.filter((v) => v != null);
        if (!present.length) return { vals, lo: 0, hi: 1, empty: true };
        let lo = cfg.min != null ? cfg.min : Math.min(...present);
        let hi = cfg.max != null ? cfg.max : Math.max(...present);
        if (cfg.min == null && cfg.max == null) { const pad = (hi - lo || Math.abs(hi) || 1) * 0.08; lo -= pad; hi += pad; }
        const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
        let d = "", pen = false;
        vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? " L" : " M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
        return { vals, lo, hi, y, d };
      };
      const L = series(left), R = series(right);
      const fmt = (v) => (Math.abs(v) >= 100 ? Math.round(v) : Number.isInteger(v) ? v : v.toFixed(1));
      const barMax = bars ? Math.max(1, ...rows.map((r) => Number(r[bars.key]) || 0)) : 1;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: H, display: "block" }}>
          {L && [L.lo, (L.lo + L.hi) / 2, L.hi].map((t, i) => (
            <g key={i}>
              <line x1={padL} x2={W - padR} y1={L.y(t)} y2={L.y(t)} stroke="#1f2937" />
              <text x={padL - 4} y={L.y(t) + 4} fontSize="10" fill={left.color} textAnchor="end">{fmt(t)}</text>
            </g>
          ))}
          {R && !R.empty && [R.lo, (R.lo + R.hi) / 2, R.hi].map((t, i) => (
            <text key={i} x={W - padR + 4} y={R.y(t) + 4} fontSize="10" fill={right.color}>{fmt(t)}</text>
          ))}
          {bars && rows.map((r, i) => {
            const v = Number(r[bars.key]) || 0; if (!v) return null;
            const h = ((H - padT - padB) * v) / barMax;
            return <rect key={i} x={x(i) - 3} y={H - padB - h} width="6" height={h} fill="#334155" rx="1" />;
          })}
          {R && !R.empty && <path d={R.d} fill="none" stroke={right.color} strokeWidth="1.5" strokeDasharray="4 3" />}
          {R && !R.empty && R.vals.map((v, i) => v == null ? null : <circle key={i} cx={x(i)} cy={R.y(v)} r="2" fill={right.color} />)}
          {L && <path d={L.d} fill="none" stroke={left.color} strokeWidth="2" strokeLinejoin="round" />}
          {L && L.vals.map((v, i) => v == null ? null : <circle key={i} cx={x(i)} cy={L.y(v)} r="2.5" fill={left.color} />)}
          {rows.map((r, i) => (i % Math.ceil(n / 6) === 0 || i === n - 1) ? (
            <text key={i} x={x(i)} y={H - 5} fontSize="10" fill="#64748b" textAnchor="middle">{r.day.slice(5)}</text>
          ) : null)}
        </svg>
      );
    }

    // ---------- Day vitals: hourly HR/HRV over QoL bands with dose markers ----------
    const QOL_COLORS = { 1: "#ef4444", 2: "#f97316", 3: "#eab308", 4: "#22c55e", 5: "#38bdf8" };
    function hourOf(ts) {
      const d = new Date(ts);
      const parts = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "numeric", hour12: false, timeZone: "America/Los_Angeles" }).formatToParts(d);
      const h = Number(parts.find((p) => p.type === "hour").value) % 24;
      const m = Number(parts.find((p) => p.type === "minute").value);
      return h + m / 60;
    }

    function DayVitalsChart({ data }) {
      const W = 600, H = 220, padL = 34, padR = 34, padT = 14, padB = 20;
      const x = (h) => padL + ((W - padL - padR) * h) / 24;
      const avg = data.hourly.heart_rate_avg || [];
      const mn = data.hourly.heart_rate_min || [];
      const mx = data.hourly.heart_rate_max || [];
      const hrv = data.hourly.heart_rate_variability || [];
      const hrVals = [...avg, ...mn, ...mx].map((p) => p.value);
      const lo = hrVals.length ? Math.min(...hrVals) - 5 : 40, hi = hrVals.length ? Math.max(...hrVals) + 5 : 120;
      const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
      const hrvVals = hrv.map((p) => p.value);
      const hlo = hrvVals.length ? Math.min(...hrvVals) * 0.8 : 0, hhi = hrvVals.length ? Math.max(...hrvVals) * 1.1 : 100;
      const yh = (v) => padT + (H - padT - padB) * (1 - (v - hlo) / (hhi - hlo || 1));
      const line = (pts, yf) => pts.map((p, i) => (i ? "L" : "M") + x(hourOf(p.ts) + 0.5).toFixed(1) + " " + yf(p.value).toFixed(1)).join(" ");
      const byHour = (arr) => Object.fromEntries(arr.map((p) => [Math.floor(hourOf(p.ts)), p.value]));
      const mnH = byHour(mn), mxH = byHour(mx);
      const bandHours = Object.keys(mnH).filter((h) => mxH[h] != null).map(Number).sort((a, b) => a - b);
      const band = bandHours.length
        ? "M" + bandHours.map((h) => x(h + 0.5).toFixed(1) + " " + y(mxH[h]).toFixed(1)).join(" L") +

    // Spearman rank correlation on paired, non-null values. Returns {r, n} or null when too few pairs.
    function spearman(pairs) {
      const n = pairs.length;
      if (n < 7) return null;
      const rank = (arr) => {
        const idx = arr.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
        const ranks = new Array(n);
        for (let i = 0; i < n;) {
          let j = i; while (j + 1 < n && idx[j + 1][0] === idx[i][0]) j++;
          const avg = (i + j) / 2 + 1;
          for (let k = i; k <= j; k++) ranks[idx[k][1]] = avg;
          i = j + 1;
        }
        return ranks;
      };
      const rx = rank(pairs.map((p) => p[0])), ry = rank(pairs.map((p) => p[1]));
      const mx = rx.reduce((a, b) => a + b, 0) / n, my = ry.reduce((a, b) => a + b, 0) / n;
      let num = 0, dx = 0, dy = 0;
      for (let i = 0; i < n; i++) { num += (rx[i] - mx) * (ry[i] - my); dx += (rx[i] - mx) ** 2; dy += (ry[i] - my) ** 2; }
      if (!dx || !dy) return { r: 0, n };
      return { r: num / Math.sqrt(dx * dy), n };
    }
    function describeCorrelation(c) {
      if (!c) return "Need at least 7 days with both values to estimate a correlation.";
      const a = Math.abs(c.r);
      const strength = a < 0.2 ? "no real" : a < 0.4 ? "a weak" : a < 0.6 ? "a moderate" : "a strong";
      const dir = c.r > 0 ? "positive" : "negative";
      const t = a * Math.sqrt((c.n - 2) / (1 - a * a || 1e-9));
      const conf = c.n < 14 ? "very few days, treat as a hint" : t < 2 ? "could easily be chance" : "unlikely to be chance";
      return `${strength}${a < 0.2 ? "" : " " + dir} relationship (r = ${c.r.toFixed(2)}, ${c.n} days; ${conf}).`;
    }

    // ---------- Tremor test: 20 s of phone accelerometer, scored on 3.5–7.5 Hz band power ----------

    function analyzeTremor(samples) {
      // samples: [{t (ms), x, y, z}], gravity removed when the browser provides it.

      // across axes (summing powers keeps frequencies intact, unlike taking the vector magnitude first).
      if (samples.length < 100) return null;
      const t0 = samples[0].t, dur = (samples[samples.length - 1].t - t0) / 1000;
      const fs = 50, n = Math.floor(dur * fs);

      const power = new Float64Array(freqs.length);
      let sumSq = 0;

        let j = 0;
        for (let i = 0; i < n; i++) {
          const tt = t0 + (i / fs) * 1000;
          while (j < samples.length - 2 && samples[j + 1].t < tt) j++;
          const a = samples[j], b = samples[j + 1];
          const w = b.t === a.t ? 0 : (tt - a.t) / (b.t - a.t);
          u[i] = a[axis] + (b[axis] - a[axis]) * w;
        }
        const mean = u.reduce((a, b) => a + b, 0) / n;
        for (let i = 0; i < n; i++) { u[i] = (u[i] - mean) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1))); sumSq += u[i] * u[i]; }
        freqs.forEach((f, fi) => {
          let re = 0, im = 0; const k = (2 * Math.PI * f) / fs;
          for (let i = 0; i < n; i++) { re += u[i] * Math.cos(k * i); im -= u[i] * Math.sin(k * i); }
          power[fi] += (re * re + im * im) / n;
        });
      }
      const total = power.reduce((a, b) => a + b, 0) || 1e-12;
      let band = 0, peakI = 0;
      freqs.forEach((f, i) => { if (f >= 3.5 && f <= 7.5) band += power[i]; if (power[i] > power[peakI]) peakI = i; });
      const hannGain = 2.67; // 1 / mean(hann^2)
      // 1.25: empirical calibration of the 0.1 Hz-spaced DFT band sum against known sinusoids (recovers amplitude within ~2%)
      const rmsBand = Math.sqrt((band / n) * 2 * hannGain) * 1.25;
      const rmsAll = Math.sqrt((sumSq / n) * hannGain);
      const pmax = Math.max(...power) || 1;
      // Peak frequency inside the tremor band (falls back to 5 Hz when the band is empty)
      let bandPeakI = -1;
      freqs.forEach((f, i) => { if (f >= 3.5 && f <= 7.5 && (bandPeakI < 0 || power[i] > power[bandPeakI])) bandPeakI = i; });
      const bandHz = bandPeakI >= 0 ? freqs[bandPeakI] : 5;
      // Displacement from acceleration for a sinusoid: x = a / (2*pi*f)^2. Peak-to-peak, in cm.
      const aPeak = rmsBand * Math.SQRT2;
      const ampCm = (2 * aPeak) / Math.pow(2 * Math.PI * bandHz, 2) * 100;
      // MDS-UPDRS 3.17 amplitude bins: 0 none, 1 <1 cm, 2 1–3 cm, 3 3–10 cm, 4 >10 cm. Floor at 0.1 cm for "none".
      const updrs = ampCm < 0.1 ? 0 : ampCm < 1 ? 1 : ampCm < 3 ? 2 : ampCm < 10 ? 3 : 4;
      return {
        seconds: Number(dur.toFixed(1)), samples: samples.length, sampleRate: Number((samples.length / dur).toFixed(1)),
        bandRatio: band / total, peakHz: freqs[peakI], bandHz, rmsBand, rmsAll, ampCm, updrs,
        spectrum: freqs.map((f, i) => [f, power[i] / pmax]),
      };
    }

    function TremorTestCard({ onSaved }) {

            </div>
          </div>

                {(() => { const vals = hist.map((h) => h.value); const hi = Math.max(1.2, ...vals); const x = (i) => 10 + (580 * i) / Math.max(1, hist.length - 1); const y = (v) => 52 - (46 * v) / hi;

    // ---------- Finger tapping test: alternate taps between two targets for 20 s ----------
    const TAP_SECONDS = 20;
    function analyzeTaps(taps) {
      // taps: [{t (ms), target: 0|1, x, y}] in order
      if (taps.length < 5) return null;
      const dur = (taps[taps.length - 1].t - taps[0].t) / 1000;
      const iti = []; let correct = 0;
      for (let i = 1; i < taps.length; i++) { iti.push(taps[i].t - taps[i - 1].t); if (taps[i].target !== taps[i - 1].target) correct++; }
      const mean = iti.reduce((a, b) => a + b, 0) / iti.length;
      const sd = Math.sqrt(iti.reduce((a, b) => a + (b - mean) ** 2, 0) / iti.length);
      const cv = sd / mean;
      const half = Math.floor(iti.length / 2);
      const rate1 = 1000 / (iti.slice(0, half).reduce((a, b) => a + b, 0) / half);
      const rate2 = 1000 / (iti.slice(half).reduce((a, b) => a + b, 0) / (iti.length - half));
      const decrement = (rate1 - rate2) / rate1; // + = slowed down over the test
      const hesitations = iti.filter((v) => v > 2 * mean).length;
      const rate = taps.length / dur;
      // Heuristic score in the spirit of MDS-UPDRS 3.4 (rate, rhythm, decrement, hesitations). Not calibrated to clinic ratings.
      let score = rate >= 4 ? 0 : rate >= 3 ? 1 : rate >= 2 ? 2 : rate >= 1 ? 3 : 4;
      if (cv > 0.25 || decrement > 0.25 || hesitations >= 3) score = Math.min(4, score + 1);
      return { taps: taps.length, seconds: Number(dur.toFixed(1)), rate, itiMs: mean, cv, decrement, hesitations, accuracy: correct / (taps.length - 1), score, iti };
    }

    function TapTestCard() {
      const [phase, setPhase] = useState("idle"); // idle | recording | done
      const [hand, setHand] = useState(() => { try { return localStorage.getItem("pdm-tap-hand") || "right"; } catch { return "right"; } });
      const [left, setLeft] = useState(TAP_SECONDS);
      const [count, setCount] = useState(0);
      const [result, setResult] = useState(null);
      const [note, setNote] = useState("");
      const [msg, setMsg] = useState("");
      const taps = useRef([]); const timer = useRef(null); const started = useRef(false);
      const cancel = () => { clearInterval(timer.current); started.current = false; setPhase("idle"); setMsg(""); };

      useEffect(() => { try { localStorage.setItem("pdm-tap-hand", hand); } catch {} }, [hand]);

      const begin = () => { taps.current = []; started.current = false; setCount(0); setLeft(TAP_SECONDS); setMsg(""); setPhase("recording"); };
      const finish = () => {
        clearInterval(timer.current);
        const res = analyzeTaps(taps.current);

      };

        e.preventDefault();
        if (phase !== "recording") return;

        if (!started.current) {
          started.current = true;
          const t0 = now;

            const remaining = TAP_SECONDS - (performance.now() - t0) / 1000;

        }

        setCount(taps.current.length);
      };

        const ts = new Date().toISOString();

        const items = [
          ["tap_rate", Number(result.rate.toFixed(3))], ["tap_iti_ms", Number(result.itiMs.toFixed(1))], ["tap_cv", Number(result.cv.toFixed(4))],
          ["tap_decrement", Number(result.decrement.toFixed(4))], ["tap_accuracy", Number(result.accuracy.toFixed(4))], ["tap_updrs", result.score], ["tap_score", 5 - result.score],
        ].map(([metric, value]) => ({ ts, source: "motor", metric, value, raw }));
        const r = await apiFetch("/api/observations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(items) });
        if (r.ok) { setPhase("idle"); setResult(null); setNote(""); setMsg("Saved."); } else setMsg("Save failed.");
      };

      const circle = (target) => (
        <div
          onPointerDown={onTap(target)}

            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 700, userSelect: "none", touchAction: "none", WebkitUserSelect: "none" }}>

        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">Finger tapping test</div>
              <div className="card-subtitle">Alternate taps between the two targets with your index finger, as fast and evenly as you can, for 20 s. The clock starts on your first tap.</div>
            </div>
          </div>
          {phase === "idle" && (
            <>
              <div className="controls-row" style={{ gap: 8 }}>

                <button type="button" className="pill-btn primary" onClick={begin}>Start</button>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 6 }}>

                  ["Rhythm (CV)", Math.round(result.cv * 100) + "%"], ["Slowdown", Math.round(result.decrement * 100) + "%"], ["Alternation", Math.round(result.accuracy * 100) + "%"]].map(([k, v]) => (
                  <div key={k} style={{ background: "#0f172a", borderRadius: 8, padding: "8px 10px" }}>

                  </div>
                ))}
              </div>
              <svg viewBox="0 0 600 70" style={{ width: "100%", height: 70, display: "block", marginTop: 8 }}>
                {(() => { const lo = Math.min(...result.iti) * 0.9, hi = Math.max(...result.iti) * 1.05; const x = (i) => 10 + (580 * i) / Math.max(1, result.iti.length - 1); const y = (v) => 66 - (48 * (v - lo)) / (hi - lo || 1);
                  return <>
                    <text x="10" y="10" fontSize="10" fill="#64748b">interval between taps (ms); dashed = mean {Math.round(result.itiMs)} ms</text>
                    <line x1="10" x2="590" y1={y(result.itiMs)} y2={y(result.itiMs)} stroke="#334155" strokeDasharray="3 3" />
                    <path d={"M" + result.iti.map((v, i) => `${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" L")} fill="none" stroke="#38bdf8" strokeWidth="1.5" />
                  </>; })()}
              </svg>
              <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>Score is a heuristic in the spirit of MDS-UPDRS 3.4 (rate, rhythm, slowdown, hesitations). Your own baseline matters more than the absolute number.</div>
              <DoseStateLine />
              <div className="controls-row" style={{ gap: 8, marginTop: 6 }}>
                <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (e.g. pre-dose)"
                  style={{ flex: 1, background: "#0f172a", color: "#e2e8f0", border: "1px solid #334155", borderRadius: 8, padding: "8px 10px", fontSize: 14 }} />
                <button type="button" className="pill-btn primary" onClick={save}>Save</button>
                <button type="button" className="pill-btn" onClick={() => { setPhase("idle"); setResult(null); }}>Discard</button>
              </div>
            </>
          )}
          {msg && <div className="card-subtitle" style={{ marginTop: 6, color: msg === "Saved." ? "#a3e635" : "#f87171" }}>{msg}</div>}
          {hist.length > 1 && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 11, color: "#94a3b8" }}>Taps per second, last {hist.length} tests</div>
              <svg viewBox="0 0 600 60" style={{ width: "100%", height: 60, display: "block" }}>
                {(() => { const vals = hist.map((h) => h.value); const hi = Math.max(5, ...vals); const x = (i) => 10 + (580 * i) / Math.max(1, hist.length - 1); const y = (v) => 52 - (46 * v) / hi;
                  return <>
                    <path d={"M" + hist.map((h, i) => `${x(i).toFixed(1)} ${y(h.value).toFixed(1)}`).join(" L")} fill="none" stroke="#38bdf8" strokeWidth="1.5" />
                    {hist.map((h, i) => <circle key={i} cx={x(i)} cy={y(h.value)} r="2.5" fill={h.raw && h.raw.hand === "left" ? "#60a5fa" : "#38bdf8"}><title>{new Date(h.ts).toLocaleString()} · {h.raw && h.raw.hand} · {h.value.toFixed(2)} taps/s{h.raw && h.raw.note ? " · " + h.raw.note : ""}</title></circle>)}
                  </>; })()}
              </svg>

      );
    }

    // Personal-baseline score: how many of the given features are worse than this person's own history (mean + 1 SD),
    // computed from prior saved tests. Needs at least `minN` prior tests; returns null until then.
    // features: [{key, value, higherIsWorse}], history: {key: [values...]}
    function baselineScore(features, history, minN = 5) {
      const n = Math.min(...features.map((f) => (history[f.key] || []).length));
      if (!isFinite(n) || n < minN) return { score: null, n: isFinite(n) ? n : 0, details: [] };

    // ---------- DDK test: repeat "pa-ta-ka" for 10 s; syllable onsets from the loudness envelope ----------
    const DDK_SECONDS = 10;
    function analyzeDdk(pcm, sampleRate) {
      // Syllable nuclei = peaks of the loudness envelope with a dip on both sides (de Jong & Wempe style). No ASR.
      // 10 ms RMS windows at 5 ms hop, 15 ms smoothing: short enough to keep the 20–60 ms consonant dips.
      const hop = Math.round(sampleRate * 0.005), win = Math.round(sampleRate * 0.01);
      const env = [];
      for (let st = 0; st + win <= pcm.length; st += hop) { let e = 0; for (let i = 0; i < win; i++) e += pcm[st + i] * pcm[st + i]; env.push(Math.sqrt(e / win)); }
      if (env.length < 100) return null;
      const sm = env.map((_, i) => { let a = 0, n = 0; for (let k = -1; k <= 1; k++) { const v = env[i + k]; if (v != null) { a += v; n++; } } return a / n; });
      // speech floor relative to the loud part of the recording (90th percentile), not the single loudest frame
      const sorted = [...sm].sort((a, b) => a - b); const p90 = sorted[Math.floor(0.9 * (sorted.length - 1))];
      const floor = Math.max(0.002, p90 * 0.12);
      const minDist = Math.round(0.08 / 0.005); // 80 ms -> up to ~12 syll/s
      const half = Math.round(0.04 / 0.005);
      const cand = [];
      for (let i = half; i < sm.length - half; i++) {
        if (sm[i] < floor) continue;
        let isMax = true; for (let k = -half; k <= half; k++) if (sm[i + k] > sm[i]) { isMax = false; break; }
        if (!isMax) continue;
        if (!cand.length || i - cand[cand.length - 1] >= minDist) cand.push(i); else if (sm[i] > sm[cand[cand.length - 1]]) cand[cand.length - 1] = i;
      }
      // keep a peak if the valley to the previous kept peak drops to <= 80% of the lower of the two
      const peaks = [];
      for (const i of cand) {
        if (!peaks.length) { peaks.push(i); continue; }
        const j = peaks[peaks.length - 1]; let valley = Infinity; for (let k = j; k <= i; k++) if (sm[k] < valley) valley = sm[k];
        if (valley <= 0.8 * Math.min(sm[i], sm[j])) peaks.push(i);
        else if (sm[i] > sm[j]) peaks[peaks.length - 1] = i;
      }
      // speech span: first to last frame above floor; coverage = share of that span inside the detected run
      let first = sm.findIndex((v) => v >= floor), last = sm.length - 1; while (last > 0 && sm[last] < floor) last--;
      const speechSeconds = Math.max(0.01, (last - first) * 0.005);
      const coverage = peaks.length > 1 ? ((peaks[peaks.length - 1] - peaks[0]) * 0.005) / speechSeconds : 0;
      if (peaks.length < 6) return { count: peaks.length, tooFew: true, env: sm, onsets: peaks, speechSeconds, coverage };
      const t = peaks.map((i) => i * 0.005);
      const ioi = []; for (let i = 1; i < t.length; i++) ioi.push(t[i] - t[i - 1]);
      const mean = ioi.reduce((a, b) => a + b, 0) / ioi.length;
      const sd = Math.sqrt(ioi.reduce((a, b) => a + (b - mean) ** 2, 0) / ioi.length);
      const span = t[t.length - 1] - t[0];
      const h = Math.floor(ioi.length / 2);
      const r1 = h / ioi.slice(0, h).reduce((a, b) => a + b, 0), r2 = (ioi.length - h) / ioi.slice(h).reduce((a, b) => a + b, 0);
      const amps = peaks.map((i) => sm[i]); const pm = amps.reduce((a, b) => a + b, 0) / amps.length;
      const pcv = Math.sqrt(amps.reduce((a, b) => a + (b - pm) ** 2, 0) / amps.length) / pm;
      return { count: peaks.length, rate: (peaks.length - 1) / span, ioiMs: mean * 1000, cv: sd / mean, decrement: (r1 - r2) / r1, loudnessCv: pcv, seconds: span, speechSeconds, coverage, env: sm, onsets: peaks };
    }

    function DdkTestCard() {
      const [phase, setPhase] = useState("idle");
      const [left, setLeft] = useState(DDK_SECONDS);

        loadHistory(DDK_KEYS.map((k) => k[0])).then((h) => setBase(baselineScore(DDK_KEYS.map(([k, w]) => ({ key: k, value: k === "ddk_rate" ? result.rate : k === "ddk_cv" ? result.cv : k === "ddk_decrement" ? result.decrement : result.loudnessCv, higherIsWorse: w })), h)));

        const chunks = [];

          .map(([metric, value]) => ({ ts, source: "motor", metric, value, raw }));

      return (
        <div className="card">

            <div>
              <div className="card-title">Pa-ta-ka test (DDK)</div>

            </div>
          </div>

          {phase === "recording" && (

              <div style={{ height: 8, background: "#0f172a", borderRadius: 4, margin: "8px 40px" }}><div style={{ height: 8, borderRadius: 4, background: "#a3e635", width: `${Math.min(100, level * 400)}%` }} /></div>

          {phase === "done" && result && (
            <>

                  ["Slowdown", Math.round(result.decrement * 100) + "%"], ["Loudness CV", Math.round(result.loudnessCv * 100) + "%"], ["Interval", Math.round(result.ioiMs) + " ms"]].map(([k, v]) => (

                  ? <div style={{ fontSize: 13 }}>Building baseline: {base.n} of 5 tests saved. No score until then.</div>

                {(() => { const e = result.env; const hi = Math.max(...e) || 1; const x = (i) => 10 + (580 * i) / (e.length - 1); const y = (v) => 62 - (50 * v) / hi;

    // ---------- Reading test: pitch variability (monopitch) and rate over a read passage ----------
    const PASSAGES = [
      { id: "rainbow", title: "The Rainbow Passage (standard)", standard: true, text: "When the sunlight strikes raindrops in the air, they act as a prism and form a rainbow. The rainbow is a division of white light into many beautiful colors. These take the shape of a long round arch, with its path high above, and its two ends apparently beyond the horizon. There is, according to legend, a boiling pot of gold at one end. People look, but no one ever finds it. When a man looks for something beyond his reach, his friends say he is looking for the pot of gold at the end of the rainbow." },
      { id: "grandfather", title: "The Grandfather Passage", text: "You wished to know all about my grandfather. Well, he is nearly ninety-three years old; he dresses himself in an ancient black frock coat, usually minus several buttons; yet he still thinks as swiftly as ever. A long, flowing beard clings to his chin, giving those who observe him a pronounced feeling of the utmost respect. When he speaks, his voice is just a bit cracked and quivers a trifle. Twice each day he plays skillfully and with zest upon our small organ. Except in the winter when the ooze or snow or ice prevents, he slowly takes a short walk in the open air each day." },
      { id: "walden", title: "Thoreau, Walden (1854)", text: "I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach, and not, when I came to die, discover that I had not lived. I did not wish to live what was not life, living is so dear; nor did I wish to practise resignation, unless it was quite necessary. I wanted to live deep and suck out all the marrow of life, to live so sturdily and Spartan-like as to put to rout all that was not life." },
      { id: "mobydick", title: "Melville, Moby-Dick (1851)", text: "Call me Ishmael. Some years ago, never mind how long precisely, having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world. It is a way I have of driving off the spleen and regulating the circulation. Whenever I find myself growing grim about the mouth; whenever it is a damp, drizzly November in my soul; then, I account it high time to get to sea as soon as I can." },
      { id: "darwin", title: "Darwin, On the Origin of Species (1859)", text: "It is interesting to contemplate an entangled bank, clothed with many plants of many kinds, with birds singing on the bushes, with various insects flitting about, and with worms crawling through the damp earth, and to reflect that these elaborately constructed forms, so different from each other, and dependent on each other in so complex a manner, have all been produced by laws acting around us. There is grandeur in this view of life, with its several powers, having been originally breathed into a few forms or into one." },
      { id: "twain", title: "Twain, Life on the Mississippi (1883)", text: "The face of the water, in time, became a wonderful book, a book that was a dead language to the uneducated passenger, but which told its mind to me without reserve, delivering its most cherished secrets as clearly as if it uttered them with a voice. And it was not a book to be read once and thrown aside, for it had a new story to tell every day. Throughout the long twelve hundred miles there was never a page that was void of interest, never one that you could leave unread without loss." },

    function analyzeReading(pcm, sampleRate) {
      const frame = Math.round(sampleRate * 0.04), hop = Math.round(sampleRate * 0.01);
      const minLag = Math.round(sampleRate / 400), maxLag = Math.round(sampleRate / 70);
      const frames = [];
      for (let st = 0; st + frame <= pcm.length; st += hop) { let e = 0; for (let i = 0; i < frame; i++) e += pcm[st + i] * pcm[st + i]; frames.push({ st, rms: Math.sqrt(e / frame) }); }
      if (frames.length < 50) return null;
      const maxRms = Math.max(...frames.map((f) => f.rms)); const speechThresh = Math.max(0.003, maxRms * 0.08);
      let voicedN = 0;
      for (const f of frames) {
        f.speech = f.rms >= speechThresh; f.voiced = false;
        if (!f.speech || f.rms < maxRms * 0.15) continue;
        let mean = 0; for (let i = 0; i < frame; i++) mean += pcm[f.st + i]; mean /= frame;
        let best = 0, bestLag = 0, e0 = 0; for (let i = 0; i < frame; i++) { const v = pcm[f.st + i] - mean; e0 += v * v; }
        for (let lag = minLag; lag <= maxLag; lag += 2) {
          let num = 0, e1 = 0; for (let i = 0; i + lag < frame; i += 2) { const a = pcm[f.st + i] - mean, b = pcm[f.st + i + lag] - mean; num += a * b; e1 += b * b; }
          const r = num / Math.sqrt((e0 || 1e-12) * (e1 || 1e-12)); if (r > best) { best = r; bestLag = lag; }
        }
        if (best > 0.6) { f.voiced = true; f.f0 = sampleRate / bestLag; voicedN++; }
      }
      if (voicedN < 30) return { tooShort: true, voicedSeconds: voicedN * 0.01 };
      // semitone pitch; drop octave errors (> 7 st from running median)
      let f0s = frames.filter((f) => f.voiced).map((f) => f.f0);
      const med = [...f0s].sort((a, b) => a - b)[Math.floor(f0s.length / 2)];
      const st = f0s.map((f) => 12 * Math.log2(f / med)).filter((v) => Math.abs(v) < 7);
      const meanSt = st.reduce((a, b) => a + b, 0) / st.length;
      const sdSt = Math.sqrt(st.reduce((a, b) => a + (b - meanSt) ** 2, 0) / st.length);
      const sorted = [...st].sort((a, b) => a - b); const rangeSt = sorted[Math.floor(0.95 * (sorted.length - 1))] - sorted[Math.floor(0.05 * (sorted.length - 1))];
      // syllable-ish rate from envelope peaks of speech frames (10 ms), pauses = runs of non-speech >= 150 ms
      const env = frames.map((f) => f.rms); const sm = env.map((v, i) => ((env[i - 1] || v) + v + (env[i + 1] || v)) / 3);
      let peaks = 0; for (let i = 1; i < sm.length - 1; i++) if (sm[i] > sm[i - 1] && sm[i] >= sm[i + 1] && sm[i] > speechThresh * 1.5 && (i < 2 || sm[i] > sm[i - 2])) { peaks++; i += 8; }
      let pauseFrames = 0, run = 0; frames.forEach((f) => { if (!f.speech) { run++; } else { if (run >= 15) pauseFrames += run; run = 0; } }); if (run >= 15) pauseFrames += run;
      const first = frames.findIndex((f) => f.speech); let last = frames.length - 1; while (last > 0 && !frames[last].speech) last--;
      const seconds = Math.max(0.01, (last - first) * 0.01);
      return { seconds, meanF0: med * Math.pow(2, meanSt / 12), sdSt, rangeSt, rate: peaks / seconds, pausePct: pauseFrames / Math.max(1, last - first), voicedSeconds: voicedN * 0.01, st };
    }

    function ReadingTestCard() {

          const val = (k) => k === "read_f0_sd_st" ? result.sdSt : k === "read_range_st" ? result.rangeSt : k === "read_rate" ? result.rate : result.pausePct;
          setBase(baselineScore(READ_KEYS.map(([k, w]) => ({ key: k, value: val(k), higherIsWorse: w })), out));
        })();
      }, [phase]);
      const start = async () => {
        setMsg("");

        catch (e) { ctx.close(); setMsg("Microphone access denied or unavailable (" + e.message + ")."); return; }

        const src = ctx.createMediaStreamSource(stream); const proc = ctx.createScriptProcessor(2048, 1, 1); const gain = ctx.createGain(); gain.gain.value = 0;
        const chunks = [];
        proc.onaudioprocess = (e) => { const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); let s2 = 0; for (let i = 0; i < d.length; i++) s2 += d[i] * d[i]; setLevel(Math.sqrt(s2 / d.length)); };

          ["read_norm", (() => { const n = normScore([{ value: result.sdSt, ...NORMS.read_f0_sd_st }]); return n ? n.score : null; })()]].filter(([, v]) => v != null)
          .map(([metric, value]) => ({ ts, source: "motor", metric, value, raw }));
        const r = await apiFetch("/api/observations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(items) });
        if (r.ok) { setPhase("idle"); setResult(null); setNote(""); setMsg("Saved."); } else setMsg("Save failed.");
      };

            </div>

          {phase === "idle" && (
            <>
              <select value={pid} onChange={(e) => setPid(e.target.value)} style={{ width: "100%", background: "#0f172a", color: "#e2e8f0", border: "1px solid #334155", borderRadius: 8, padding: "8px", fontSize: 13, marginTop: 4 }}>

            <div style={{ background: "#0f172a", borderRadius: 10, padding: "12px 14px", marginTop: 8, fontSize: 17, lineHeight: 1.55, color: phase === "recording" ? "#f8fafc" : "#cbd5e1" }}>{passage.text}</div>
          )}

            <div style={{ textAlign: "center", padding: "10px 0" }}>

                  <div key={k} style={{ background: "#0f172a", borderRadius: 8, padding: "8px 10px" }}>

                <div style={{ fontSize: 11, color: "#94a3b8" }}>Score vs your own baseline on this passage (1–5, 5 = at or better than baseline)</div>

              </div>
              <NormLine norm={normScore([{ value: result.sdSt, ...NORMS.read_f0_sd_st }])} what="pitch variability vs 2.48 ± 0.56 st (Rusz 2011, read text)" />
              <svg viewBox="0 0 600 60" style={{ width: "100%", height: 60, display: "block", marginTop: 8 }}>
                {(() => { const v = result.st; const x = (i) => 10 + (580 * i) / Math.max(1, v.length - 1); const y = (s) => 36 - s * 3;
                  return <><text x="10" y="10" fontSize="10" fill="#64748b">pitch over the read, semitones around median</text><line x1="10" x2="590" y1={y(0)} y2={y(0)} stroke="#334155" strokeDasharray="3 3" />

                <button type="button" className="pill-btn primary" onClick={save}>Save</button>

                  return <><path d={"M" + hist.map((h, i) => `${x(i).toFixed(1)} ${y(h.value).toFixed(1)}`).join(" L")} fill="none" stroke="#c084fc" strokeWidth="1.5" />

    // ---------- Gait test: phone in a front pocket, 30 s walk ----------
    const GAIT_SECONDS = 30, GAIT_LEAD = 5;
    function analyzeGait(samples) {
      // samples: [{t, x, y, z}] with gravity. Orientation-free magnitude, 50 Hz, 1 s moving-mean removed, light smoothing.
      if (samples.length < 200) return null;
      const t0 = samples[0].t, dur = (samples[samples.length - 1].t - t0) / 1000, fs = 50, n = Math.floor(dur * fs);
      const mag = samples.map((p) => Math.sqrt(p.x * p.x + p.y * p.y + p.z * p.z));
      const u = new Float64Array(n); let j = 0;
      for (let i = 0; i < n; i++) { const tt = t0 + (i / fs) * 1000; while (j < samples.length - 2 && samples[j + 1].t < tt) j++; const a = samples[j], b = samples[j + 1]; const w = b.t === a.t ? 0 : (tt - a.t) / (b.t - a.t); u[i] = mag[j] + (mag[j + 1] - mag[j]) * w; }
      const d = new Float64Array(n);
      for (let i = 0; i < n; i++) { let a = 0, c = 0; for (let k = -25; k <= 25; k++) { const v = u[i + k]; if (v != null) { a += v; c++; } } d[i] = u[i] - a / c; }
      const sm = new Float64Array(n);
      for (let i = 0; i < n; i++) { let a = 0, c = 0; for (let k = -2; k <= 2; k++) { const v = d[i + k]; if (v != null) { a += v; c++; } } sm[i] = a / c; }
      const rms = Math.sqrt(sm.reduce((a, b) => a + b * b, 0) / n);
      if (rms < 0.3) return { tooStill: true, rms };
      // step peaks: local maxima >= 0.3*rms*... use adaptive threshold, min 0.3 s apart (max 200 steps/min)
      const thr = 0.5 * rms, minDist = Math.round(0.3 * fs), half = Math.round(0.15 * fs);
      const peaks = [];
      for (let i = half; i < n - half; i++) {
        if (sm[i] < thr) continue;
        let isMax = true; for (let k = -half; k <= half; k++) if (sm[i + k] > sm[i]) { isMax = false; break; }
        if (!isMax) continue;
        if (!peaks.length || i - peaks[peaks.length - 1] >= minDist) peaks.push(i); else if (sm[i] > sm[peaks[peaks.length - 1]]) peaks[peaks.length - 1] = i;
      }
      if (peaks.length < 15) return { tooFew: true, steps: peaks.length, rms };
      const st = []; for (let i = 1; i < peaks.length; i++) st.push((peaks[i] - peaks[i - 1]) / fs);
      const mean = st.reduce((a, b) => a + b, 0) / st.length;
      const sd = Math.sqrt(st.reduce((a, b) => a + (b - mean) ** 2, 0) / st.length);

    // ---------- Balance test: 30 s quiet stance, phone held flat against the chest ----------

    function BalanceTestCard() {
